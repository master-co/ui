[install]
linker = "hoisted"
# Wait one day before installing a newly published version (Bun uses seconds).
minimumReleaseAge = 86400

# These exact first-party releases were built, tested and published by their own release workflows.
minimumReleaseAgeExcludes = ["@master/css-astro@2.1.3", "@master/css-binding-darwin-arm64@2.1.3", "@master/css-binding-darwin-x64@2.1.3", "@master/css-binding-linux-arm64-gnu@2.1.3", "@master/css-binding-linux-arm64-musl@2.1.3", "@master/css-binding-linux-x64-gnu@2.1.3", "@master/css-binding-linux-x64-musl@2.1.3", "@master/css-binding-wasm-compiler@2.1.3", "@master/css-binding-wasm-engine@2.1.3", "@master/css-binding-wasm-tooling@2.1.3", "@master/css-binding-win32-arm64-msvc@2.1.3", "@master/css-binding-win32-x64-msvc@2.1.3", "@master/css-binding@2.1.3", "@master/css-compiler@2.1.3", "@master/css-language-service@2.1.3", "@master/css-preset@2.1.3", "@master/css-runtime@2.1.3", "@master/css-schema@2.1.3", "@master/css-server@2.1.3", "@master/css-tooling@2.1.3", "@master/css-vite@2.1.3", "@master/css@2.1.3", "@master/internal-site@0.2.12", "@master/internal-skills@0.1.6"]

[run]
# Keep real Node available to scripts that call `node`.
bun = false
