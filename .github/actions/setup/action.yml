name: Set up the workspace
description: Install Node, Bun and the locked dependencies.
inputs:
  ignore-scripts:
    description: Skip husky and package install scripts when only aronrepo runs.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          bun install --frozen-lockfile --ignore-scripts
        else
          bun install --frozen-lockfile
        fi
