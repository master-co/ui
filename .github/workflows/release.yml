name: Release
# Every push to a release branch deploys the site and previews the next package release.
# A maintainer publishes @master/ui by running this workflow with the previewed commit and version.
on:
  push:
    branches: [main, alpha, beta, rc, canary]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of the release branch to release
        required: true
      version:
        description: Version from the preview, such as 1.0.0-alpha.1
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer push replaces an older preview or deployment; a release is never cancelled halfway through publishing.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preview:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # versions come from tags and the full history
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      - run: |
          bun x aronrepo explain --json > plan.json
          jq -r '"Next release: \(.version // "none") from `\(.head)`\n\n\(.notes // "")"' plan.json >> "$GITHUB_STEP_SUMMARY"

  deploy-site:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository settings: secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, optional variable CLOUDFLARE_PAGES_PROJECT.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'master-ui' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: bun x wrangler pages deploy out --project-name "$PAGES_PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Report a skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Cloudflare credentials are not configured; the site was built but not deployed."

  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm # required reviewers approve the release
    permissions:
      contents: write # push the version tag and create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0 # also fetches the release branch, which the release checks the commit against
      - uses: ./.github/actions/setup
      - run: bun run test
      - run: bun x aronrepo release --branch "$GITHUB_REF_NAME" --expect "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # optional with npm trusted publishing
