name: Release
# Every push to main validates the workspace, releases @master/ui when its commits call for a release,
# checks the version the registry serves, and deploys the site with the version it documents.
# Versions come from the v* tags (v0.0.0 is the baseline, never published) and the commit types; see AGENTS.md.
on:
  push:
    branches: [main]
  # Reruns the jobs for the head of main, such as after npm publishing access was set up.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through publishing; the next push waits and releases its commits too.
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the version tag and create the GitHub release
      id-token: write # npm trusted publishing and provenance
    outputs:
      released: ${{ steps.outcome.outputs.released }}
      version: ${{ steps.outcome.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # versions come from tags and the full history
      - uses: ./.github/actions/setup
      - name: Install the publishing npm CLI
        run: |
          npm install --global npm@11.21.0
          test "$(npm --version)" = 11.21.0
      - name: Plan the release
        id: plan
        run: |
          # Outside the checkout: aronrepo releases only from a clean working tree.
          plan="$RUNNER_TEMP/plan.json"
          bun x aronrepo explain --json > "$plan"
          echo "version=$(jq -r '.version // ""' "$plan")" >> "$GITHUB_OUTPUT"
          jq -r '"Next release: \(.version // "none") from `\(.head)`\n\n\(.notes // "")"' "$plan" >> "$GITHUB_STEP_SUMMARY"
      - run: bun run build:ui
      - run: bun x aronrepo release --branch "$GITHUB_REF_NAME"
        env:
          # npm auth is trusted publishing alone (master-co/ui, release.yml); no NPM_TOKEN is passed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the newest release on main
        id: outcome
        env:
          PLANNED: ${{ steps.plan.outputs.version }}
        run: |
          git fetch --tags --force origin
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=$([ -n "$PLANNED" ] && [ "$PLANNED" = "$version" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  verify-registry:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install the published version into an empty project and check its provenance
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/verify-package.mjs "@master/ui@$VERSION"

  deploy-site:
    needs: [release, verify-registry]
    if: ${{ always() && needs.release.result == 'success' && (needs.verify-registry.result == 'success' || (needs.release.outputs.released == 'false' && needs.verify-registry.result == 'skipped')) }}
    # The site shows the newest release in its header; v0.0.0 is only the baseline, so it shows none.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository settings: secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, optional variable CLOUDFLARE_PAGES_PROJECT.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'master-ui' }}
      PUBLIC_VERSION: ${{ needs.release.outputs.version != '0.0.0' && needs.release.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: bun x wrangler pages deploy out --project-name "$PAGES_PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Report a skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::Cloudflare credentials are not configured; the site was built but not deployed."
