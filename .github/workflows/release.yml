name: Release
# Every push to main validates the workspace, releases @master/ui when its commits call for a release,
# checks the version the registry serves, and delivers the site with the version it documents.
# Versions come from the v* tags (v0.0.0 is the baseline, never published) and the commit types; see AGENTS.md.
on:
  push:
    branches: [main]
  # Reruns the jobs for the head of main, such as after npm publishing access was set up.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through publishing; the next push waits and releases its commits too.
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the version tag and create the GitHub release
      id-token: write # npm trusted publishing and provenance
    outputs:
      released: ${{ steps.outcome.outputs.released }}
      version: ${{ steps.outcome.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # versions come from tags and the full history
      - uses: ./.github/actions/setup
      - name: Install the publishing npm CLI
        run: |
          npm install --global npm@11.21.0
          test "$(npm --version)" = 11.21.0
      - name: Plan the release
        id: plan
        run: |
          # Outside the checkout: aronrepo releases only from a clean working tree.
          plan="$RUNNER_TEMP/plan.json"
          bun x aronrepo explain --json > "$plan"
          echo "version=$(jq -r '.version // ""' "$plan")" >> "$GITHUB_OUTPUT"
          jq -r '"Next release: \(.version // "none") from `\(.head)`\n\n\(.notes // "")"' "$plan" >> "$GITHUB_STEP_SUMMARY"
      - run: bun run build:ui
      - run: bun x aronrepo release --branch "$GITHUB_REF_NAME"
        env:
          # npm auth is trusted publishing alone (master-co/ui, release.yml); no NPM_TOKEN is passed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the newest release on main
        id: outcome
        env:
          PLANNED: ${{ steps.plan.outputs.version }}
        run: |
          git fetch --tags --force origin
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          version=${tag#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=$([ -n "$PLANNED" ] && [ "$PLANNED" = "$version" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  verify-registry:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install the published version into an empty project and check its provenance
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/verify-package.mjs "@master/ui@$VERSION"

  deploy-site:
    needs: [release, verify-registry]
    # The site deploys on its own, not only with a release. `plan` delivers a release with its version,
    # and any other push with the newest release, whatever it changed; only a pending release holds it.
    # A release delivers only once the registry serves it with provenance.
    if: ${{ always() && needs.release.result == 'success' && (needs.verify-registry.result == 'success' || (needs.release.outputs.released == 'false' && needs.verify-registry.result == 'skipped')) }}
    runs-on: ubuntu-latest
    # Includes the wait for the Cloudflare Pages build of pages-stable and for ui.master.co to serve it.
    timeout-minutes: 75
    permissions:
      contents: write # attach the site manifest to the release and move pages-stable
      checks: read # read the Cloudflare Pages check of the delivered commit
    # Cloudflare Pages builds pages-stable with its Git integration (scripts/build-site-hosted.sh);
    # this job holds no Cloudflare credential and uploads nothing to Cloudflare. See site/README.md.
    env:
      PUBLIC_URL: https://ui.master.co
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PAGES_SUBDOMAIN: ${{ vars.CLOUDFLARE_PAGES_SUBDOMAIN }}
      PAGES_RELEASE_MODE: ${{ vars.CLOUDFLARE_PAGES_MODE }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # the plan reads the release tags and the commits since the newest one
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Sets PUBLIC_VERSION and SITE_DELIVERY for the following steps when the site delivers.
      - name: Plan the site delivery for this push
        id: plan
        run: node scripts/pages-site-release.mjs plan
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
      - name: Require the release tag and the version the registry serves
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: node scripts/pages-site-release.mjs preflight
      # Cloudflare must reproduce these final, verified bytes.
      - name: Build the exact site revision with its identity
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: |
          bun run build
          node scripts/pages-site-release.mjs identity
      - name: Install browser
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: bun x playwright install --with-deps chromium
        working-directory: packages/ui
      - name: Verify the final output on the Pages runtime and in a browser
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: |
          bun run test:site-hosting
          bun run test:site
        env:
          MASTER_UI_BROWSER: chromium
      - name: Create the output manifest
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: node scripts/pages-site-release.mjs manifest
      - name: Retain the verified site output
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-release-${{ github.sha }}
          path: |
            site/out/
            release-artifacts/site.manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish the manifest, advance pages-stable and wait for the deployment
        if: ${{ steps.plan.outputs.deliver == 'true' }}
        run: node scripts/pages-site-release.mjs deliver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain the delivery receipt
        if: ${{ always() && steps.plan.outputs.deliver == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/site-delivery.json
          if-no-files-found: warn
          retention-days: 90
