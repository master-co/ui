name: CI
# Pull requests run it here; every push to main runs it as the first job of the Release workflow.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Called from Release, github.workflow names the caller, so keep the group apart from Release's own.
  group: CI-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The commit hook and the PR title check already apply the policy; a direct push can skip both,
      # so check every pushed commit again here.
      - name: Check pushed commits against the release policy
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A new branch has no previous tip, and a force push may drop it; check the head commit then.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            from="${AFTER}~1"
          else
            from="$BEFORE"
          fi
          bun x aronrepo check --from "$from" --to "$AFTER"
      - run: bun run skills:check
      - run: bun run test
      - run: bun run type-check
      - run: bun run build
      - name: Install the packed package into an empty project and use it
        run: node scripts/verify-package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.sha }}
          path: site/out/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install browser
        run: bun x playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/ui
      - name: Exercise components and platform fallbacks
        run: bun run --cwd packages/ui test:browser
        env:
          MASTER_UI_BROWSER: ${{ matrix.browser }}

  documentation-browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ github.sha }}
          path: site/out/
      - name: Install browser
        run: bun x playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/ui
      - name: Verify the built documentation and static fallbacks
        run: bun run test:site
        env:
          MASTER_UI_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-${{ matrix.browser }}-${{ github.sha }}
          path: site/.cache/documentation-tests/
          include-hidden-files: true
          retention-days: 7
