<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Master UI framework components</title>
    <style>
      body { margin: 0; padding: 1.5rem; font-family: system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1.5rem; align-items: start; }
      section > h2 { margin: 0 0 1rem; font-size: 1rem; }
      [data-example] { display: grid; gap: .5rem; padding: 1rem 0; border-top: 1px solid color-mix(in oklab, currentColor 12%, transparent); }
      [data-example] > h3 { margin: 0; font: 500 .75rem/1 ui-monospace, monospace; opacity: .6; }
      [data-example] > output { font: .75rem/1.4 ui-monospace, monospace; opacity: .8; }
    </style>
  </head>
  <body>
    <p>Every framework component in each framework, on the compiled stylesheet. Open with <code>?only=react</code>, <code>svelte</code> or <code>vue</code> for one of them, and <code>&amp;scheme=dark</code> for the dark theme.</p>
    <main></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
