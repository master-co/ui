<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan review · Studio archive</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/standalone.css">
<main style="max-inline-size:32rem; margin:auto; padding:2rem 1rem">
  <h1 class="heading">Review your plan</h1>
  <p id="quote"></p><a href="/blocks/pricing#plan-cycle">Back to plan pricing</a>
</main>
<script type="module">
  const query = new URLSearchParams(location.search)
  const plans = new Map([['solo', 'Solo'], ['studio', 'Studio']])
  const cycles = new Map([['monthly', 'monthly'], ['annual', 'annual']])
  const name = plans.get(query.get('plan'))
  const cycle = cycles.get(query.get('cycle'))
  document.getElementById('quote').textContent = name && cycle ? name + ' · ' + cycle + ' billing. This sample records no payment.' : 'Choose a plan and a billing cycle on the pricing page.'
</script>
</html>
