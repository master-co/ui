<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recording index · Field archive</title>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/standalone.css">
<style>
  body { max-inline-size: 44rem; margin: auto; padding: 1rem; color: var(--color-text-body); background: var(--color-surface-base); }
  main { display: grid; gap: 1rem; }
  h1 { font-size: 1.5rem; }
  nav:not([hidden]) { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
</style>
<main>
  <h1 class="heading">Field recordings</h1>
  <p id="scope">Recordings from the field archive</p>
  <nav aria-label="Sort recordings" id="order" hidden></nav>
  <table class="table table-compact">
    <caption id="range">Recording index</caption>
    <thead><tr><th class="table-heading" scope="col">Recording</th><th class="table-heading" scope="col">Date</th></tr></thead>
    <tbody></tbody>
  </table>
  <nav aria-label="Recording batches" id="batches"></nav>
  <noscript>This local index needs JavaScript to read the requested batch.</noscript>
</main>
<script type="module" src="./recordings.js"></script>
</html>
