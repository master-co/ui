<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <title>A polished obsidian sphere on a dark glossy floor, a softbox reflected in it</title>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1e21"/>
      <stop offset=".6" stop-color="#141517"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="pool" cx=".32" cy=".2" r=".65">
      <stop offset="0" stop-color="#46484e" stop-opacity=".75"/>
      <stop offset="1" stop-color="#46484e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0e10" stop-opacity="0"/>
      <stop offset=".4" stop-color="#0d0e10" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="ball" cx=".42" cy=".36" r=".7">
      <stop offset="0" stop-color="#2b2d32"/>
      <stop offset=".55" stop-color="#121316"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#9aa3b3" stop-opacity="0"/>
      <stop offset=".99" stop-color="#9aa3b3" stop-opacity=".13"/>
      <stop offset="1" stop-color="#9aa3b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="softbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#dfe5ef" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="reflectFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sphere"><circle cx="600" cy="500" r="200"/></clipPath>
    <mask id="mirror"><rect x="0" y="700" width="1200" height="300" fill="url(#reflectFade)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="box" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer></filter>
    <g id="orb">
      <circle cx="600" cy="500" r="200" fill="url(#ball)"/>
      <g clip-path="url(#sphere)">
        <!-- the floor seen in the lower half of the sphere -->
        <ellipse cx="600" cy="690" rx="260" ry="90" fill="#1b1c20" filter="url(#soft)"/>
        <!-- the far wall's glow, wrapping round the sphere as a soft band -->
        <ellipse cx="600" cy="596" rx="240" ry="26" fill="#3a3e46" opacity=".55" filter="url(#soft)"/>
        <!-- obsidian's cool sheen, low across from the light -->
        <ellipse cx="680" cy="560" rx="120" ry="90" fill="#2f4250" opacity=".28" filter="url(#soft)"/>
        <!-- the softbox, curved by the sphere -->
        <path d="M478 362 Q520 318 590 316 Q624 316 640 330 Q610 352 560 378 Q514 402 490 410 Q470 396 478 362 Z" fill="url(#softbox)" filter="url(#box)"/>
        <!-- a second, smaller light low on the far side -->
        <ellipse cx="716" cy="600" rx="26" ry="8" fill="#c9d3e3" opacity=".22" filter="url(#box)" transform="rotate(-38 716 600)"/>
      </g>
      <circle cx="600" cy="500" r="200" fill="url(#rim)"/>
    </g>
  </defs>
  <rect width="1200" height="1000" fill="url(#room)"/>
  <rect width="1200" height="1000" fill="url(#pool)"/>
  <ellipse cx="420" cy="250" rx="300" ry="200" fill="#5b5d64" opacity=".16" filter="url(#haze)"/>
  <rect x="0" y="560" width="1200" height="440" fill="url(#floor)"/>
  <!-- the polished floor mirrors the sphere -->
  <g mask="url(#mirror)"><use href="#orb" transform="translate(0 1400) scale(1 -1)"/></g>
  <!-- contact shadow where the sphere touches the floor -->
  <ellipse cx="610" cy="702" rx="150" ry="14" fill="#000" opacity=".8" filter="url(#soft)"/>
  <use href="#orb"/>
  <rect width="1200" height="1000" filter="url(#grain)"/>
</svg>
