<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <title>A plaster hall with three arched openings, low sun laying their shapes across the floor</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc6ba"/>
      <stop offset="1" stop-color="#ddd5ca"/>
    </linearGradient>
    <radialGradient id="bounce" cx=".5" cy="1" r=".8">
      <stop offset="0" stop-color="#efe6d8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#efe6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset=".7" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#efe7da"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ae9f"/>
      <stop offset="1" stop-color="#9c907f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e5" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f5e6cf" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="reveal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99d8e"/>
      <stop offset="1" stop-color="#c8beb0"/>
    </linearGradient>
    <linearGradient id="dust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff8ec" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1400"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#wall)"/>
  <rect width="1200" height="700" fill="url(#bounce)"/>
  <!-- the openings: bright outside, and the depth of the wall on their left reveal -->
  <path d="M285.0 700 L285.0 360 A75.0 75.0 0 0 1 435.0 360 L435.0 700 Z" fill="url(#outside)"/><path d="M525.0 700 L525.0 360 A75.0 75.0 0 0 1 675.0 360 L675.0 700 Z" fill="url(#outside)"/><path d="M765.0 700 L765.0 360 A75.0 75.0 0 0 1 915.0 360 L915.0 700 Z" fill="url(#outside)"/>
  <path d="M285 700 L285 360 A75 75 0 0 1 320 296 L308 300 A80 80 0 0 0 297 360 L297 700 Z" fill="url(#reveal)" opacity=".7"/><path d="M525 700 L525 360 A75 75 0 0 1 560 296 L548 300 A80 80 0 0 0 537 360 L537 700 Z" fill="url(#reveal)" opacity=".7"/><path d="M765 700 L765 360 A75 75 0 0 1 800 296 L788 300 A80 80 0 0 0 777 360 L777 700 Z" fill="url(#reveal)" opacity=".7"/>
  <rect y="700" width="1200" height="300" fill="url(#floor)"/>
  <rect y="698" width="1200" height="4" fill="#8c8173" opacity=".5" filter="url(#soft)"/>
  <!-- the sun through each opening, laid on the floor -->
  <g filter="url(#soft)"><path d="M285 700 L435 700 L615 930 A105.0 34 0 0 1 405 930 Z" fill="url(#beam)"/><path d="M525 700 L675 700 L855 930 A105.0 34 0 0 1 645 930 Z" fill="url(#beam)"/><path d="M765 700 L915 700 L1095 930 A105.0 34 0 0 1 885 930 Z" fill="url(#beam)"/></g>
  <!-- light hanging in the air of the room -->
  <g filter="url(#haze)"><path d="M285 300 L435 300 L665 1000 L355 1000 Z" fill="url(#dust)"/><path d="M525 300 L675 300 L905 1000 L595 1000 Z" fill="url(#dust)"/><path d="M765 300 L915 300 L1145 1000 L835 1000 Z" fill="url(#dust)"/></g>
  <rect width="1200" height="1000" filter="url(#grain)"/>
</svg>
