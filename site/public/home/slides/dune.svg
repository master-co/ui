<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <title>Dunes at first light, their ridges catching a low sun</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dbdc"/>
      <stop offset=".45" stop-color="#ece6dc"/>
      <stop offset=".62" stop-color="#f2e3cf"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".35" stop-color="#fbeedb" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f6e2c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3cfb5"/><stop offset="1" stop-color="#d4bc9e"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcc19f"/><stop offset="1" stop-color="#bb9f7f"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfae88"/><stop offset="1" stop-color="#9c7f61"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8956f"/><stop offset="1" stop-color="#6f5843"/></linearGradient>
    <!-- a shadowed face: darkest just under its crest, lifting as it falls toward the trough -->
    <linearGradient id="lee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f3c2e" stop-opacity=".42"/><stop offset=".55" stop-color="#4f3c2e" stop-opacity=".18"/><stop offset="1" stop-color="#4f3c2e" stop-opacity="0"/></linearGradient>
    <linearGradient id="ripplesFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".4" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="ripplesMask"><rect width="1200" height="1000" fill="url(#ripplesFade)"/></mask>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- wind ripples on the near slope -->
    <pattern id="ripples" width="60" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0 10 Q15 4 30 10 T60 10" fill="none" stroke="#6b5440" stroke-opacity=".06" stroke-width="1.5"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#sky)"/>
  <circle cx="800" cy="470" r="230" fill="url(#sun)"/>
  <circle cx="800" cy="470" r="34" fill="#fffbf3"/>
  <ellipse cx="600" cy="560" rx="700" ry="70" fill="#f7e8d2" opacity=".7" filter="url(#haze)"/>
  <!-- far range -->
  <path d="M0 560 C140 520 260 512 380 532 C500 552 560 520 680 508 C820 494 960 528 1200 520 L1200 1000 L0 1000 Z" fill="url(#far)"/>
  <!-- middle dune, lit face and shadowed face divided by a sharp ridge -->
  <path d="M0 650 C180 600 330 588 470 610 C560 624 600 600 690 570 C780 600 900 640 1200 628 L1200 1000 L0 1000 Z" fill="url(#mid)"/>
  <path d="M690 570 C780 600 900 640 1200 628 L1200 780 C1010 760 840 700 690 570 Z" fill="url(#lee)"/>
  <path d="M470 610 C560 624 600 600 690 570 C640 600 560 630 470 610 Z" fill="#f6e4c9" opacity=".55"/>
  <!-- near dune -->
  <path d="M0 770 C120 730 250 700 360 690 C420 684 470 700 520 724 C640 690 780 700 900 740 C1000 770 1100 780 1200 770 L1200 1000 L0 1000 Z" fill="url(#near)"/>
  <path d="M520 724 C640 690 780 700 900 740 C1000 770 1100 780 1200 770 L1200 920 C1000 900 760 830 520 724 Z" fill="url(#lee)"/>
  <path d="M0 770 C120 730 250 700 360 690 C420 684 470 700 520 724 C640 690 780 700 900 740 C1000 770 1100 780 1200 770 L1200 1000 L0 1000 Z" fill="url(#ripples)" mask="url(#ripplesMask)"/>
  <!-- front dune -->
  <path d="M0 900 C160 850 320 830 460 840 C600 852 680 880 760 900 C880 860 1040 850 1200 870 L1200 1000 L0 1000 Z" fill="url(#front)"/>
  <path d="M760 900 C880 860 1040 850 1200 870 L1200 1000 L900 1000 C860 960 820 930 760 900 Z" fill="url(#lee)"/>
  <path d="M0 900 C160 850 320 830 460 840 C600 852 680 880 760 900 C880 860 1040 850 1200 870 L1200 1000 L0 1000 Z" fill="url(#ripples)" opacity=".9"/>
  <rect width="1200" height="1000" filter="url(#grain)"/>
</svg>
