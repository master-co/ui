<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <title>A pearl on a stone plinth, in soft morning light</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e8e4"/>
      <stop offset=".58" stop-color="#dcdcda"/>
      <stop offset="1" stop-color="#c8cacd"/>
    </linearGradient>
    <radialGradient id="window" cx=".2" cy=".08" r=".75">
      <stop offset="0" stop-color="#fbfaf7" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fbfaf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd1d2" stop-opacity="0"/>
      <stop offset=".35" stop-color="#cfd1d2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b3b7bc"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f0ec"/>
      <stop offset=".45" stop-color="#e3e2de"/>
      <stop offset="1" stop-color="#b9bbbe"/>
    </linearGradient>
    <radialGradient id="plinthTop" cx=".35" cy=".4" r=".8">
      <stop offset="0" stop-color="#fbfaf8"/>
      <stop offset="1" stop-color="#e2e1dd"/>
    </radialGradient>
    <radialGradient id="pearl" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#f4f3f0"/>
      <stop offset=".72" stop-color="#d9d9d8"/>
      <stop offset="1" stop-color="#a9adb4"/>
    </radialGradient>
    <radialGradient id="sheen" cx=".68" cy=".74" r=".42">
      <stop offset="0" stop-color="#b9d0ee" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b9d0ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx=".3" cy=".82" r=".35">
      <stop offset="0" stop-color="#f3dcc0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f3dcc0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="600" cy="470" r="168"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="spec" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#wall)"/>
  <rect width="1200" height="1000" fill="url(#window)"/>
  <!-- a seamless sweep: the wall bends into the floor with no line between them -->
  <rect x="0" y="560" width="1200" height="440" fill="url(#floor)"/>
  <!-- the plinth's long shadow, cast away from the window -->
  <path d="M740 760 L1200 840 L1200 960 L760 830 Z" fill="#7d838b" opacity=".32" filter="url(#softer)"/>
  <ellipse cx="610" cy="852" rx="250" ry="34" fill="#5f656d" opacity=".35" filter="url(#soft)"/>
  <path d="M380 640h440v170c0 22-98 40-220 40s-220-18-220-40z" fill="url(#plinth)"/>
  <ellipse cx="600" cy="640" rx="220" ry="40" fill="url(#plinthTop)"/>
  <ellipse cx="600" cy="640" rx="220" ry="40" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2"/>
  <!-- contact and cast shadow of the pearl on the plinth -->
  <ellipse cx="664" cy="648" rx="160" ry="24" fill="#6e747c" opacity=".42" filter="url(#soft)"/>
  <ellipse cx="606" cy="638" rx="84" ry="10" fill="#3f444a" opacity=".55" filter="url(#spec)"/>
  <circle cx="600" cy="470" r="168" fill="url(#pearl)"/>
  <g clip-path="url(#ball)">
    <circle cx="600" cy="470" r="168" fill="url(#sheen)"/>
    <circle cx="600" cy="470" r="168" fill="url(#warm)"/>
    <!-- the plinth top reflected low in the pearl -->
    <ellipse cx="600" cy="630" rx="190" ry="36" fill="#f7f6f2" opacity=".55" filter="url(#soft)"/>
    <circle cx="600" cy="470" r="168" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="10" filter="url(#spec)"/>
  </g>
  <ellipse cx="540" cy="402" rx="46" ry="30" fill="#ffffff" opacity=".95" filter="url(#spec)" transform="rotate(-28 540 402)"/>
  <ellipse cx="528" cy="394" rx="14" ry="9" fill="#ffffff" transform="rotate(-28 528 394)"/>
  <rect width="1200" height="1000" filter="url(#grain)"/>
</svg>
