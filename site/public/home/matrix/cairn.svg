    <radialGradient id="stone2" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#e3e0da"/><stop offset=".6" stop-color="#aaa7a1"/><stop offset="1" stop-color="#6a6c70"/></radialGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffaf0" stop-opacity=".9"/><stop offset="1" stop-color="#f4ede0" stop-opacity="0"/></radialGradient>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1100"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="41" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  </defs>
