<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <title>A cairn of smooth stones on a high ridge, mountains fading behind it in the evening light</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e97a1"/>
      <stop offset=".6" stop-color="#cdcfd0"/>
      <stop offset="1" stop-color="#ebe4d8"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d737a"/>
      <stop offset="1" stop-color="#3b4046"/>
    </linearGradient>
    <radialGradient id="stone0" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#d9d6d0"/><stop offset=".6" stop-color="#9c9a95"/><stop offset="1" stop-color="#5e6064"/></radialGradient>
