<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <title>A lighthouse on a dark headland at dusk, its beam crossing the haze over a still sea</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76808c"/>
      <stop offset=".55" stop-color="#b3b9c0"/>
      <stop offset="1" stop-color="#e6e0d5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9aeb4"/>
      <stop offset=".3" stop-color="#7d858e"/>
      <stop offset="1" stop-color="#3a4047"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6168"/>
      <stop offset=".45" stop-color="#3d4248"/>
      <stop offset="1" stop-color="#2a2e33"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99a0a8"/>
      <stop offset="1" stop-color="#aeb3b9"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f4f0"/>
      <stop offset=".55" stop-color="#e4e1db"/>
      <stop offset="1" stop-color="#b9b6b0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d636a"/>
      <stop offset="1" stop-color="#3b4046"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff8e8" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#fbf3e2" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f6efe2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8e8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fbf2df" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f6efe2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e2" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fbf3e2" stop-opacity="0"/>
    </linearGradient>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1100"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1100"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  </defs>

  <!-- the sky, darkening upward, and a long bank of cloud low over the sea -->
  <rect width="1200" height="430" fill="url(#sky)"/>
  <ellipse cx="380" cy="360" rx="520" ry="22" fill="#8f97a1" opacity=".5" filter="url(#haze)"/>
  <ellipse cx="980" cy="120" rx="360" ry="40" fill="#6c7581" opacity=".35" filter="url(#haze)"/>

  <!-- the beam: a wide, soft fan to the left through the haze, a short one behind the lantern -->
  <path d="M878 204 L0 96 L0 312 Z" fill="url(#beam)" filter="url(#soft)"/>
  <path d="M878 204 L0 156 L0 240 Z" fill="url(#beam)" opacity=".55" filter="url(#blur)"/>
  <path d="M878 204 L1200 176 L1200 236 Z" fill="url(#beamRight)" opacity=".5" filter="url(#soft)"/>
  <circle cx="878" cy="204" r="120" fill="url(#glow)"/>

  <!-- a far headland on the horizon, lost in the haze, tapering into the sea -->
  <path d="M0 414 C70 402 140 394 210 397 C280 400 330 412 380 421 C410 426 440 429 470 430 L0 431 Z" fill="url(#far)" opacity=".85"/>

  <!-- the sea, and a hairline of light at the horizon -->
  <rect y="430" width="1200" height="245" fill="url(#sea)"/>
  <rect y="429" width="1200" height="2" fill="#efe9de" opacity=".7"/>

  <!-- the beam's light lying on the water beneath it, and the swell catching it in short strokes -->
  <ellipse cx="420" cy="446" rx="360" ry="10" fill="#f4ecdc" opacity=".35" filter="url(#soft)"/>
  <g fill="url(#trail)" opacity=".8">
    <rect x="520" y="440" width="70" height="2.5" rx="1.25"/>
    <rect x="430" y="450" width="54" height="2" rx="1"/>
    <rect x="560" y="458" width="40" height="2" rx="1"/>
    <rect x="340" y="447" width="60" height="2" rx="1"/>
    <rect x="470" y="468" width="36" height="1.6" rx=".8"/>
    <rect x="250" y="456" width="44" height="1.6" rx=".8"/>
    <rect x="600" y="476" width="30" height="1.6" rx=".8"/>
  </g>
  <g stroke="#cfd3d7" stroke-width="1" opacity=".18">
    <path d="M60 470h180M330 492h240M120 528h160M420 560h300M40 600h260M600 620h220M920 590h180"/>
  </g>

  <g transform="translate(70 8)">
  <!-- the headland: a cliff dropping to the sea, a plateau under the tower, its face catching the last light -->
  <path d="M612 675 C626 640 640 610 652 584 C664 560 662 536 672 510 C682 482 694 440 712 404 C740 392 770 386 808 384 C860 382 910 386 960 394 C1020 404 1080 400 1140 392 C1170 388 1190 388 1200 389 L1200 675 Z" fill="url(#land)"/>
  <path d="M672 510 C682 482 694 440 712 404 C722 400 732 397 742 395 C734 420 726 462 716 500 C706 536 690 560 680 590 C672 616 666 646 664 675 L612 675 C626 640 640 610 652 584 C664 560 662 536 672 510 Z" fill="#737981" opacity=".5"/>
  <path d="M712 404 C740 392 770 386 808 384 C860 382 910 386 960 394 C1020 404 1080 400 1140 392 C1170 388 1190 388 1200 389" fill="none" stroke="#7d838a" stroke-width="1.6" opacity=".8"/>
  <path d="M742 395 C734 420 728 456 722 500 M770 392 C764 430 760 470 758 520 M900 388 C930 420 990 436 1060 438" fill="none" stroke="#1f2328" stroke-width="1.4" opacity=".35"/>
  <path d="M712 404 C740 392 770 386 808 384 C860 382 910 386 960 394 C1020 404 1080 400 1140 392 C1170 388 1190 388 1200 389 L1200 470 L700 470 Z" fill="#9aa1a9" opacity=".18" filter="url(#soft)"/>
  <!-- rocks at the cliff's foot, and the surf breaking on them -->
  <path d="M574 675 C578 652 590 640 606 638 C616 644 620 660 622 675 Z" fill="#30353a"/>
  <path d="M546 675 C552 664 562 658 574 659 C580 666 582 670 582 675 Z" fill="#3a3f45"/>
  <path d="M540 670 C566 652 596 634 624 630" fill="none" stroke="#ece8e1" stroke-width="2" opacity=".3" filter="url(#blur)"/>
  <path d="M640 610 C652 584 664 556 672 520" fill="none" stroke="#ece8e1" stroke-width="1.6" opacity=".18" filter="url(#blur)"/>

  <!-- the keeper's house on the plateau beside the tower -->
  <path d="M846 384 h60 v-28 h-60 z" fill="#e3e0da"/>
  <path d="M876 356 h30 v28 h-30 z" fill="#2c3136" opacity=".14"/>
  <path d="M840 358 L876 338 L912 358 Z" fill="#454b51"/>
  <rect x="856" y="365" width="9" height="11" fill="#f6e7c4" opacity=".9"/>
  <rect x="886" y="365" width="9" height="11" fill="#5a6066"/>
  <path d="M830 384 h12" stroke="#7d838a" stroke-width="1.4"/>

  <!-- the tower: tapered, lit from the left, one dark band -->
  <path d="M790 384 L796 228 L820 228 L826 384 Z" fill="url(#tower)"/>
  <path d="M791.6 342 L824.4 342 L825.2 362 L790.8 362 Z" fill="url(#band)"/>
  <path d="M794 290 L822 290 L822.6 302 L793.4 302 Z" fill="url(#band)" opacity=".85"/>
  <rect x="805" y="372" width="7" height="12" rx="1" fill="#41464c"/>
  <rect x="806" y="318" width="4" height="7" fill="#5b6167" opacity=".7"/>

  <!-- the gallery, the lantern room and its cap -->
  <rect x="788" y="222" width="40" height="6" fill="#3d4248"/>
  <path d="M790 222 v-8 M798 222 v-8 M806 222 v-8 M814 222 v-8 M822 222 v-8 M826 222 v-8" stroke="#3d4248" stroke-width="1.2"/>
  <rect x="789" y="213" width="38" height="1.6" fill="#3d4248"/>
  <rect x="797" y="190" width="22" height="24" fill="#fff6dc"/>
  <path d="M804 190 v24 M812 190 v24" stroke="#8c8a84" stroke-width="1"/>
  <path d="M794 190 L808 174 L822 190 Z" fill="#3a3f45"/>
  <rect x="806.6" y="166" width="2.8" height="9" fill="#3a3f45"/>
  <circle cx="808" cy="202" r="7" fill="#fffdf6" filter="url(#blur)"/>

  </g>

  <!-- grain over everything, so the gradients read as light rather than as fills -->
  <rect width="1200" height="675" filter="url(#grain)"/>
</svg>
