<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <title>A wooden pier running out into a still harbor on a misty morning, a sailboat moored beside it</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa2ab"/>
      <stop offset=".6" stop-color="#d1d3d4"/>
      <stop offset="1" stop-color="#ece6db"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cbcc"/>
      <stop offset=".35" stop-color="#9da4ab"/>
      <stop offset="1" stop-color="#59616a"/>
    </linearGradient>
    <linearGradient id="postReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f45" stop-opacity=".9"/>
      <stop offset="1" stop-color="#3a3f45" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#fbf3e3" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f4ede0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7ea" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fdf7ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1100"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="21" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="430" fill="url(#sky)"/>
  <circle cx="470" cy="300" r="170" fill="url(#sun)"/>
  <circle cx="470" cy="300" r="26" fill="#fffaf1"/>
  <!-- hills fading back into the mist -->
  <path d="M0 404 C120 360 230 352 340 372 C430 388 520 360 640 352 C760 344 860 376 980 380 C1080 384 1150 368 1200 360 V432 H0 Z" fill="#b6bbc1" opacity=".75"/>
  <path d="M0 420 C160 396 300 404 460 414 C640 426 820 404 1000 410 C1100 414 1160 420 1200 422 V432 H0 Z" fill="#a3a9b0" opacity=".85"/>
  <ellipse cx="600" cy="420" rx="700" ry="26" fill="#e2ddd3" opacity=".6" filter="url(#haze)"/>
  <rect y="430" width="1200" height="245" fill="url(#water)"/>
  <rect y="429" width="1200" height="2" fill="#f1ece2" opacity=".8"/>
  <!-- the sun laid on the water -->
  <g fill="url(#glint)">
    <rect x="440" y="440" width="60" height="3" rx="1.5"/><rect x="452" y="452" width="36" height="2.5" rx="1.2"/>
    <rect x="430" y="466" width="78" height="2.5" rx="1.2"/><rect x="458" y="482" width="26" height="2" rx="1"/>
    <rect x="436" y="500" width="64" height="2" rx="1"/><rect x="448" y="522" width="40" height="1.6" rx=".8"/>
  </g>
  <g stroke="#e6e3dd" stroke-width="1.2" opacity=".18" fill="none"><path d="M483 470 h117" /><path d="M211 470 h141" /><path d="M980 484 h79" /><path d="M184 484 h57" /><path d="M40 498 h142" /><path d="M1125 498 h114" /><path d="M120 512 h96" /><path d="M1065 512 h177" /><path d="M737 526 h110" /><path d="M353 526 h67" /><path d="M536 540 h94" /><path d="M52 540 h106" /><path d="M556 554 h89" /><path d="M337 554 h119" /><path d="M593 568 h200" /><path d="M762 568 h62" /><path d="M691 582 h139" /><path d="M1036 582 h103" /><path d="M364 596 h103" /><path d="M969 596 h111" /><path d="M182 610 h180" /><path d="M614 610 h41" /><path d="M597 624 h186" /><path d="M638 624 h170" /><path d="M399 638 h145" /><path d="M867 638 h193" /><path d="M590 652 h150" /><path d="M924 652 h81" /><path d="M477 666 h118" /><path d="M531 666 h51" /></g>
  
  <g>
    <path d="M250 452 C258 466 330 468 352 456 L356 448 L246 448 Z" fill="#e8e5df"/>
    <path d="M246 448 L356 448 L352 456 C330 468 258 466 250 452 Z" fill="#2c3136" opacity=".18"/>
    <path d="M300 448 V360" stroke="#5b6168" stroke-width="2"/>
    <path d="M302 366 L340 440 L302 440 Z" fill="#f2efe9" opacity=".9"/>
    <path d="M250 470 C270 478 330 478 352 470" stroke="#e8e5df" stroke-width="3" opacity=".25" fill="none"/>
  </g>
  <g opacity=".75">
    <path d="M610 438 C614 446 650 447 662 441 L664 436 L606 436 Z" fill="#d9d6d0"/>
    <path d="M634 436 V384" stroke="#6b7178" stroke-width="1.4"/>
  </g>

  <!-- the pier, its posts and their reflections -->
  <rect x="1168.0" y="520.0" width="24.0" height="190.0" rx="4.8" fill="#3a3f45"/><rect x="1168.0" y="710.0" width="24.0" height="114.0" fill="url(#postReflect)" opacity=".5"/><rect x="1078.8" y="505.9" width="21.3" height="167.4" rx="4.3" fill="#3a3f45"/><rect x="1078.8" y="673.2" width="21.3" height="100.4" fill="url(#postReflect)" opacity=".5"/><rect x="994.8" y="492.5" width="18.8" height="146.1" rx="3.8" fill="#3a3f45"/><rect x="994.8" y="638.6" width="18.8" height="87.6" fill="url(#postReflect)" opacity=".5"/><rect x="916.3" y="480.1" width="16.4" height="126.1" rx="3.3" fill="#3a3f45"/><rect x="916.3" y="606.2" width="16.4" height="75.7" fill="url(#postReflect)" opacity=".5"/><rect x="843.4" y="468.5" width="14.2" height="107.6" rx="2.8" fill="#3a3f45"/><rect x="843.4" y="576.2" width="14.2" height="64.6" fill="url(#postReflect)" opacity=".5"/><rect x="776.6" y="457.9" width="12.2" height="90.7" rx="2.4" fill="#3a3f45"/><rect x="776.6" y="548.6" width="12.2" height="54.4" fill="url(#postReflect)" opacity=".5"/><rect x="716.1" y="448.3" width="10.4" height="75.3" rx="2.1" fill="#3a3f45"/><rect x="716.1" y="523.6" width="10.4" height="45.2" fill="url(#postReflect)" opacity=".5"/><rect x="662.5" y="439.8" width="8.8" height="61.7" rx="1.8" fill="#3a3f45"/><rect x="662.5" y="501.5" width="8.8" height="37.0" fill="url(#postReflect)" opacity=".5"/><rect x="616.4" y="432.5" width="7.4" height="50.0" rx="1.5" fill="#3a3f45"/><rect x="616.4" y="482.5" width="7.4" height="30.0" fill="url(#postReflect)" opacity=".5"/><rect x="578.7" y="426.5" width="6.2" height="40.5" rx="1.2" fill="#3a3f45"/><rect x="578.7" y="467.0" width="6.2" height="24.3" fill="url(#postReflect)" opacity=".5"/><rect x="551.1" y="422.2" width="5.4" height="33.5" rx="1.1" fill="#3a3f45"/><rect x="551.1" y="455.6" width="5.4" height="20.1" fill="url(#postReflect)" opacity=".5"/><rect x="537.5" y="420.0" width="5.0" height="30.0" rx="1.0" fill="#3a3f45"/><rect x="537.5" y="450.0" width="5.0" height="18.0" fill="url(#postReflect)" opacity=".5"/>
  <path d="M1228.0 514.0 L1108.0 530.0 L530.0 422.0 L547.5 419.0 Z" fill="#4a5057"/><path d="M1228.0 514.0 L1108.0 530.0 L1108.0 542.0 L1228.0 526.0 Z" fill="#2f3439"/>
  <path d="M1180.0 450.0 L540.0 406.0" stroke="#555b62" stroke-width="3" fill="none"/><path d="M1180.0 450.0 V520.0" stroke="#555b62" stroke-width="3.0"/><path d="M1004.2 437.9 V492.5" stroke="#555b62" stroke-width="2.6"/><path d="M850.5 427.3 V468.5" stroke="#555b62" stroke-width="2.3"/><path d="M721.3 418.5 V448.3" stroke="#555b62" stroke-width="1.9"/><path d="M620.0 411.5 V432.5" stroke="#555b62" stroke-width="1.5"/><path d="M553.8 406.9 V422.2" stroke="#555b62" stroke-width="1.2"/>
  <rect width="1200" height="675" filter="url(#grain)"/>
</svg>
