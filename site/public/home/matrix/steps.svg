<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <title>Cantilevered concrete steps climbing a plaster wall, a tall patch of sun falling across them</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d5ce"/>
      <stop offset="1" stop-color="#bfbbb4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9a59f"/>
      <stop offset="1" stop-color="#85817b"/>
    </linearGradient>
    <linearGradient id="tread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcbc4"/>
      <stop offset="1" stop-color="#a7a39c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9ec" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff9ec" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1400" height="1200"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blurry" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1400" height="1200"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="51" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#wall)"/>
  <!-- the sun from a tall window out of frame, its mullion a dark bar through the patch -->
  <path d="M520 0 L840 0 L1120 900 L800 900 Z" fill="url(#sun)" opacity=".55" filter="url(#blurry)"/>
  <path d="M668 0 L690 0 L970 900 L948 900 Z" fill="#b5b1aa" opacity=".35" filter="url(#soft)"/>
  <!-- a hairline joint in the plaster -->
  <path d="M0 300 H1200" stroke="#b2aea7" stroke-width="1.2" opacity=".5"/>
  <g filter="url(#soft)"><path d="M150 882 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M262 800 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M374 718 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M486 636 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M598 554 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M710 472 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M822 390 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M934 308 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/><path d="M1046 226 h170 l46 46 h-170 z" fill="#6f6b65" opacity=".28"/></g>
  <rect x="150" y="860" width="170" height="22" fill="url(#tread)"/><rect x="150" y="860" width="170" height="3" fill="#f6f3ee"/><rect x="150" y="879" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="262" y="778" width="170" height="22" fill="url(#tread)"/><rect x="262" y="778" width="170" height="3" fill="#f6f3ee"/><rect x="262" y="797" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="374" y="696" width="170" height="22" fill="url(#tread)"/><rect x="374" y="696" width="170" height="3" fill="#f6f3ee"/><rect x="374" y="715" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="486" y="614" width="170" height="22" fill="url(#tread)"/><rect x="486" y="614" width="170" height="3" fill="#f6f3ee"/><rect x="486" y="633" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="598" y="532" width="170" height="22" fill="url(#tread)"/><rect x="598" y="532" width="170" height="3" fill="#f6f3ee"/><rect x="598" y="551" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="710" y="450" width="170" height="22" fill="url(#tread)"/><rect x="710" y="450" width="170" height="3" fill="#f6f3ee"/><rect x="710" y="469" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="822" y="368" width="170" height="22" fill="url(#tread)"/><rect x="822" y="368" width="170" height="3" fill="#f6f3ee"/><rect x="822" y="387" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="934" y="286" width="170" height="22" fill="url(#tread)"/><rect x="934" y="286" width="170" height="3" fill="#f6f3ee"/><rect x="934" y="305" width="170" height="3" fill="#8e8a84" opacity=".5"/><rect x="1046" y="204" width="170" height="22" fill="url(#tread)"/><rect x="1046" y="204" width="170" height="3" fill="#f6f3ee"/><rect x="1046" y="223" width="170" height="3" fill="#8e8a84" opacity=".5"/>
  <rect y="900" width="1200" height="100" fill="url(#floor)"/>
  <rect y="900" width="1200" height="2" fill="#f1ede6" opacity=".6"/>
  <!-- a bench on the floor, for scale -->
  <rect x="820" y="854" width="240" height="14" fill="#5a5e63"/>
  <rect x="836" y="868" width="10" height="32" fill="#4a4e53"/><rect x="1034" y="868" width="10" height="32" fill="#4a4e53"/>
  <path d="M812 900 h264 l30 18 h-264 z" fill="#6f6b65" opacity=".25" filter="url(#soft)"/>
  <rect width="1200" height="1000" filter="url(#grain)"/>
</svg>
