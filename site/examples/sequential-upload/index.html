<section data-example="sequential-upload" class="grid gap-md p-lg">
  <h2 class="heading">Upload a recording batch</h2>
  <p role="status" id="batch-status">5 files ready</p>
  <div class="file" id="active-file" hidden>
    <progress class="progress file-progress" max="100" value="0" aria-labelledby="batch-name"></progress>
    <span class="file-page" aria-hidden="true"></span>
    <div class="file-body"><p class="file-name" id="batch-name"></p><p class="file-meta" id="batch-percent"></p></div>
  </div>
  <div class="flex flex-wrap gap-xs"><button class="btn btn-sm" type="button" id="batch-start">Start batch</button>
    <button class="btn btn-sm" type="button" id="batch-cancel" disabled>Cancel batch</button></div>
</section>
