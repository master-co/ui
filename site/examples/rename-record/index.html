<section data-example="rename-record" class="grid gap-sm p-lg">
  <h2 class="heading" id="record-name">Recording name</h2>
  <div class="field">
    <div class="editable">
      <button class="editable-preview" type="button" aria-labelledby="record-name open-name" id="open-name">Pier at dawn</button>
      <input class="editable-field" hidden required maxlength="60" aria-labelledby="record-name" aria-describedby="rename-error" value="Pier at dawn">
    </div>
    <p id="rename-error" role="status"></p>
  </div>
  <p>Last saved name: <strong id="last-saved">Pier at dawn</strong></p>
</section>
