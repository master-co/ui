<section class="flex flex-col gap-md" data-example="chart-dashboard" aria-labelledby="traffic-title">
  <header class="flex flex-wrap items-center justify-between gap-sm">
    <div class="flex flex-col gap-3xs">
      <h2 class="heading heading-sm" id="traffic-title">Traffic</h2>
      <p class="m(0) fg-text-muted" data-traffic="period" aria-live="polite">The last 7 days</p>
    </div>
    <div class="segmented segmented-sm" role="radiogroup" aria-label="Period">
      <label class="segmented-item"><input type="radio" class="segmented-input" name="traffic-period" value="week" checked>7 days</label>
      <label class="segmented-item"><input type="radio" class="segmented-input" name="traffic-period" value="month">30 days</label>
      <label class="segmented-item"><input type="radio" class="segmented-input" name="traffic-period" value="year">12 months</label>
    </div>
  </header>

  <div class="auto-grid auto-grid-fit" style="--auto-grid-min: 11rem">
    <div class="card">
      <div class="stat">
        <p class="stat-label">Visitors</p>
        <div class="stat-row">
          <p class="stat-value" data-traffic="visitors">12,480</p>
          <p class="stat-delta stat-delta-up" data-traffic="visitors-change"><span class="sr-only">Up </span>8.2%</p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <p class="stat-label">Sign-ups</p>
        <div class="stat-row">
          <p class="stat-value" data-traffic="signups">642</p>
          <p class="stat-delta stat-delta-up" data-traffic="signups-change"><span class="sr-only">Up </span>3.1%</p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stat">
        <p class="stat-label">Bounce rate</p>
        <div class="stat-row">
          <p class="stat-value" data-traffic="bounce">38.4%</p>
          <p class="stat-delta stat-delta-down" data-traffic="bounce-change"><span class="sr-only">Down </span>1.6%</p>
        </div>
      </div>
    </div>
  </div>

  <section class="card" aria-labelledby="traffic-visits">
    <div class="card-header">
      <h3 class="card-title" id="traffic-visits">Visitors</h3>
      <p class="card-description">New and returning</p>
    </div>
    <figure class="chart" data-traffic="visits"></figure>
  </section>

  <div class="auto-grid auto-grid-fit" style="--auto-grid-min: 17rem">
    <section class="card" aria-labelledby="traffic-sources">
      <div class="card-header">
        <h3 class="card-title" id="traffic-sources">Sources</h3>
        <p class="card-description">Where visitors came from</p>
      </div>
      <figure class="chart chart-split" style="--chart-size: 9rem" data-traffic="sources"></figure>
    </section>
    <section class="card" aria-labelledby="traffic-pages">
      <div class="card-header">
        <h3 class="card-title" id="traffic-pages">Top pages</h3>
        <p class="card-description">By visitors</p>
      </div>
      <figure class="chart" style="--chart-height: 9rem" data-traffic="pages"></figure>
    </section>
  </div>
</section>
