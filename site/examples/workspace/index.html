<div class="shell shell-fixed bg-surface-base fg-text-body text-sm" style="--shell-aside: 18rem" data-example="workspace">
  <a class="skip" href="#workspace-main">Skip to content</a>
  <aside class="shell-sidebar gap-md p-sm bxe(1) bxe-solid b-line-hair" aria-label="Workspace">
    <a class="navbar-brand h(40) px-xs" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18M12 3a9 9 0 0 0 0 18"/></svg>Atlas</a>
    <nav class="nav" aria-label="Sections">
      <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 12 5l7 7M7 10v9h10v-9"/></svg>Overview</a>
      <a class="nav-item" href="#" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"/></svg>Changelog<span class="nav-end">8</span></a>
      <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>Guides</a>
      <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l4.5-4.5 4 4 2.5-2.5 5 5M15 9v.01"/></svg>Media</a>
      <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 0 0-8 0M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.85"/></svg>Team</a>
      <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6a2 2 0 1 0 4 0a2 2 0 0 0-4 0M4 6h10M18 6h2M6 12a2 2 0 1 0 4 0a2 2 0 0 0-4 0M4 12h2M10 12h10M15 18a2 2 0 1 0 4 0a2 2 0 0 0-4 0M4 18h11M19 18h1"/></svg>Settings</a>
    </nav>
  </aside>
  <main class="shell-main flex flex-col" id="workspace-main" tabindex="-1">
    <header class="flex items-center gap-xs shrink(0) min-h(56) px-lg">
      <button type="button" class="btn btn-quiet btn-square btn-sm btn-hang-start shell-toggle" commandfor="workspace-navigation" command="show-modal" aria-label="Open navigation"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
      <h1 class="heading heading-sm min-w(0) truncate" id="workspace-title" data-title>Regions, closer to your readers</h1>
      <span class="badge badge-dot shrink(0) hidden@container(--max-sm)" data-status>Draft</span>
      <button type="button" class="btn btn-sm shrink(0) ml-auto hidden@container(--5xl)" commandfor="workspace-properties-drawer" command="show-modal" aria-label="Properties" data-properties-toggle><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM15 5v14"/></svg><span class="hidden@container(--max-sm)">Properties</span></button>
    </header>
    <div class="flex flex-col grow(1) min-h(0) px-lg pb-lg">
      <div class="editor grow(1) min-h(0)" style="--editor-rows: 3; --editor-max-rows: infinity">
        <div class="toolbar editor-toolbar" role="toolbar" aria-label="Formatting" aria-controls="workspace-document">
          <select class="select select-sm" data-command="style" aria-label="Text style">
            <option value="paragraph">Paragraph</option>
            <option value="heading">Heading</option>
            <option value="subheading">Subheading</option>
          </select>
          <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="bold" aria-label="Bold" aria-keyshortcuts="Control+B Meta+B" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h6a3.5 3.5 0 0 1 0 7h-6zM13 12h1a3.5 3.5 0 0 1 0 7h-7v-7"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="italic" aria-label="Italic" aria-keyshortcuts="Control+I Meta+I" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h6M7 19h6M14 5l-4 14"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="underline" aria-label="Underline" aria-keyshortcuts="Control+U Meta+U" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5v5a5 5 0 0 0 10 0v-5M5 19h14"/></svg></button>
          <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="bulletList" aria-label="Bulleted list" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M5 6v.01M5 12v.01M5 18v.01"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="orderedList" aria-label="Numbered list" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6h9M11 12h9M12 18h8M4 16a2 2 0 1 1 4 0c0 .6-.5 1-1 1.5l-3 2.5h4M6 10v-6l-2 2"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="blockquote" aria-label="Quotation" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11h-4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6c0 2.7-1.3 4.3-4 5M19 11h-4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6c0 2.7-1.3 4.3-4 5"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square ml-auto" data-command="undo" aria-label="Undo" aria-keyshortcuts="Control+Z Meta+Z"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-4-4 4-4M5 10h11a4 4 0 1 1 0 8h-1"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="redo" aria-label="Redo" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l4-4-4-4M19 10h-11a4 4 0 1 0 0 8h1"/></svg></button>
        </div>
        <div class="flex flex-col grow(1) min-h(0)" data-editor></div>
      </div>
    </div>
  </main>
  <aside class="shell-aside bxs(1) bxs-solid b-line-hair" aria-labelledby="workspace-properties-title">
    <header class="flex items-center shrink(0) min-h(56) px(20)">
      <h2 class="heading heading-sm" id="workspace-properties-title">Properties</h2>
    </header>
    <div class="px(20) pb(20)" data-properties-home>
      <div class="form" data-properties>
        <label class="field">
          Title
          <input class="input" type="text" name="title" value="Regions, closer to your readers" autocomplete="off">
        </label>
        <label class="field">
          Status
          <select class="select" name="status">
            <option class="select-option" value="draft">Draft</option>
            <option class="select-option" value="review">In review</option>
            <option class="select-option" value="published">Published</option>
          </select>
        </label>
        <div class="field">
          <label for="ws-summary">Summary</label>
          <textarea class="input input-auto" id="ws-summary" name="summary" aria-describedby="ws-summary-hint">Four new regions, and a faster path to all of them.</textarea>
          <span class="field-hint" id="ws-summary-hint">Shown under the title in the changelog.</span>
        </div>
        <label class="check"><input type="checkbox" role="switch" class="switch" name="listed" checked> List in the changelog</label>
      </div>
    </div>
  </aside>
  <dialog class="dialog dialog-drawer dialog-drawer-start" id="workspace-navigation" closedby="any" aria-label="Navigation">
    <div class="dialog-body flex flex-col gap-md">
      <a class="navbar-brand h(40) px-xs" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18M12 3a9 9 0 0 0 0 18"/></svg>Atlas</a>
      <nav class="nav" aria-label="Sections, in the drawer">
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 12 5l7 7M7 10v9h10v-9"/></svg>Overview</a>
        <a class="nav-item" href="#" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4"/></svg>Changelog<span class="nav-end">8</span></a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>Guides</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 16l4.5-4.5 4 4 2.5-2.5 5 5M15 9v.01"/></svg>Media</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 0 0-8 0M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.85"/></svg>Team</a>
        <a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6a2 2 0 1 0 4 0a2 2 0 0 0-4 0M4 6h10M18 6h2M6 12a2 2 0 1 0 4 0a2 2 0 0 0-4 0M4 12h2M10 12h10M15 18a2 2 0 1 0 4 0a2 2 0 0 0-4 0M4 18h11M19 18h1"/></svg>Settings</a>
      </nav>
    </div>
    <button type="button" class="btn btn-quiet btn-square btn-sm dialog-close" commandfor="workspace-navigation" command="close" aria-label="Close navigation"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </dialog>
  <dialog class="dialog dialog-drawer" id="workspace-properties-drawer" closedby="any" aria-labelledby="workspace-properties-drawer-title">
    <header class="dialog-header">
      <h2 class="dialog-title" id="workspace-properties-drawer-title">Properties</h2>
    </header>
    <div class="dialog-body" data-properties-away></div>
    <button type="button" class="btn btn-quiet btn-square btn-sm dialog-close" commandfor="workspace-properties-drawer" command="close" aria-label="Close properties"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </dialog>
</div>
