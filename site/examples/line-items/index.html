<section data-example="line-items" class="container-inline grid gap-md p-lg" aria-labelledby="items-title">
  <h2 class="heading" id="items-title">Recording estimate</h2>
  <div class="scroll-area scroll-area-inline" tabindex="0" role="region" aria-label="Estimate line items"><table class="table table-compact"><caption>Line items in USD</caption>
    <thead><tr><th class="table-heading" scope="col">Description</th><th class="table-heading" scope="col">Quantity</th><th class="table-heading table-numeric" scope="col">Unit price</th><th class="table-heading table-numeric" scope="col">Subtotal</th><th class="table-heading" scope="col">Actions</th></tr></thead>
    <tbody></tbody></table></div>
  <p>Total: <output id="items-total"></output></p><button class="btn btn-sm" type="button" id="items-add">Add item</button>
  <p role="status"></p>
  <template><table class="table"><tbody><tr>
    <th class="table-cell" scope="row"><input class="input" style="min-inline-size:9rem" aria-label="Description" data-name></th>
    <td class="table-cell"><input class="input" type="number" min="1" step="1" max="999" required aria-label="Quantity" style="inline-size:5rem" data-count></td>
    <td class="table-cell table-numeric" data-unit></td><td class="table-cell table-numeric" data-subtotal></td>
    <td class="table-cell"><div class="flex gap-xs"><button class="btn btn-sm" type="button" data-act="up">Up</button><button class="btn btn-sm" type="button" data-act="down">Down</button><button class="btn btn-sm" type="button" data-act="remove">Remove</button></div></td>
  </tr></tbody></table></template>
</section>
