<div class="auto-grid auto-grid-fit gap-md" style="--auto-grid-min: 18rem" data-example="chart-parts">
  <section class="card" aria-labelledby="storage-title">
    <header class="card-header">
      <h3 class="card-title" id="storage-title">Storage by kind</h3>
      <p class="card-description">900 GB in use</p>
      <div class="card-action">
        <div class="segmented segmented-sm" role="radiogroup" aria-label="Draw as">
          <label class="segmented-item"><input type="radio" class="segmented-input" name="storage-type" value="doughnut" checked>Doughnut</label>
          <label class="segmented-item"><input type="radio" class="segmented-input" name="storage-type" value="pie">Pie</label>
        </div>
      </div>
    </header>
    <div class="card-body flex flex-col gap-md">
      <div class="flex flex-wrap gap-xs" role="group" aria-label="Show kinds" data-legend="storage"></div>
      <div class="relative h(200) min-w(0)">
        <canvas role="img" aria-label="Storage by kind: images take almost half; the numbers are in the table below." data-chart="storage"></canvas>
      </div>
      <div class="accordion">
        <details class="accordion-item">
          <summary class="accordion-trigger">The numbers</summary>
          <div class="accordion-content">
            <table class="table table-compact">
              <caption class="sr-only">Storage by kind</caption>
              <thead><tr class="table-row"><th class="table-heading" scope="col">Kind</th><th class="table-heading table-numeric" scope="col">Gigabytes</th><th class="table-heading table-numeric" scope="col">Share</th></tr></thead>
              <tbody data-rows="storage"></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="goals-title">
    <header class="card-header">
      <h3 class="card-title" id="goals-title">This week's goals</h3>
      <p class="card-description">Each ring is one goal, filled as far as it has come</p>
    </header>
    <div class="card-body flex flex-col gap-md">
      <div class="flex flex-wrap gap-xs" role="group" aria-label="Show goals" data-legend="goals"></div>
      <div class="relative h(200) min-w(0)">
        <canvas role="img" aria-label="This week's goals as rings: deploys 18 of 24, reviews 9 of 12, incidents closed 5 of 5." data-chart="goals"></canvas>
      </div>
      <div class="accordion">
        <details class="accordion-item">
          <summary class="accordion-trigger">The numbers</summary>
          <div class="accordion-content">
            <table class="table table-compact">
              <caption class="sr-only">This week's goals</caption>
              <thead><tr class="table-row"><th class="table-heading" scope="col">Goal</th><th class="table-heading table-numeric" scope="col">Done</th><th class="table-heading table-numeric" scope="col">Target</th></tr></thead>
              <tbody data-rows="goals"></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
  </section>
</div>
