<section data-example="recording-list" class="grid gap-md p-lg">
  <h2 class="heading">Field recordings</h2>
  <label class="field">Workspace<select class="select" id="archive-mode"><option value="editor">Editor</option><option value="read">Read-only</option><option value="full">Storage full</option><option value="new">First visit</option></select></label>
  <div class="flex items-end gap-xs"><label class="field">Recording title<input class="input" type="search" id="archive-query"></label>
    <button class="btn btn-sm" type="button" id="reload-records">Reload</button></div>
  <ul class="list" aria-label="Recordings" id="archive-records"></ul>
  <div class="empty" id="archive-empty" hidden>
    <h3 class="empty-title" id="empty-title"></h3><p class="empty-description" id="empty-reason"></p>
    <div class="empty-actions"><button class="btn btn-sm" type="button" id="empty-primary"></button><button class="btn btn-sm btn-quiet" type="button" id="view-usage" hidden>View usage</button></div>
  </div>
  <p id="quota" tabindex="-1" hidden>Storage usage: 10 of 10 GB. Remove a recording to free space.</p>
  <p role="status" id="list-status"></p>
  <div class="toast-region" role="region" aria-label="Undo recording removals" aria-live="polite">
    <dialog class="toast" aria-labelledby="undo-title"><div class="toast-body"><p class="toast-title" id="undo-title"></p></div>
      <button class="btn btn-sm toast-action" type="button" id="undo-removals">Undo</button></dialog>
  </div>
  <template id="record-row"><ul class="list"><li class="list-row">
    <span class="avatar avatar-sm list-media" aria-hidden="true">FS</span>
    <div class="list-body"><p class="list-title"></p><p class="list-description"></p></div>
    <span class="list-end"><button class="btn btn-quiet btn-sm" type="button">Remove</button></span>
  </li></ul></template>
</section>
