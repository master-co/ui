<section data-example="recent-commands" class="p-lg">
  <button class="btn" type="button" commandfor="recent-palette" command="show-modal">Open commands</button>
  <dialog class="dialog command" id="recent-palette" closedby="any" aria-label="Recording commands">
    <label class="command-search"><input class="command-input" role="combobox" type="search" aria-label="Search commands" aria-expanded="true" aria-autocomplete="list" aria-controls="recent-results" autocomplete="off" autofocus></label>
    <button class="btn btn-quiet btn-sm" type="button" id="clear-history">Clear recent commands</button>
    <div class="listbox command-list" role="listbox" aria-label="Commands" id="recent-results">
      <div role="group" aria-label="Recent" id="history-group"><div role="option" class="listbox-option" id="cmd-last">Open last recording</div></div>
      <div role="option" class="listbox-option" id="cmd-index">Open recording index</div>
    </div>
  </dialog>
  <p role="status" id="command-feedback"></p>
</section>
