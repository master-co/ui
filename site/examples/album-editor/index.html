<section data-example="album-editor" class="container-inline p-lg max-w(700) mx-auto" aria-labelledby="album-title">
  <h2 class="heading" id="album-title" tabindex="-1">Harbor album</h2>
  <ol class="list sortable" aria-label="Album photographs">
    <li class="list-row sortable-item" data-value="lighthouse">
      <button class="sortable-handle" type="button" aria-pressed="false" aria-label="Move Lighthouse"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
      <div class="list-body"><img width="56" height="40" src="/demo/lighthouse.svg" alt="A lighthouse above a rocky shore" style="object-fit:cover"><strong class="list-title">Lighthouse</strong>
        <label class="field">Alternative text for Lighthouse<input class="input" value="A lighthouse above a rocky shore"></label></div>
      <button class="btn btn-quiet btn-sm" type="button" data-remove="lighthouse" aria-label="Remove Lighthouse">Remove</button>
    </li>
    <li class="list-row sortable-item" data-value="harbor">
      <button class="sortable-handle" type="button" aria-pressed="false" aria-label="Move Harbor"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
      <div class="list-body"><img width="56" height="40" src="/demo/harbor.svg" alt="Boats alongside the quay" style="object-fit:cover"><strong class="list-title">Harbor</strong>
        <label class="field">Alternative text for Harbor<input class="input" value="Boats alongside the quay"></label></div>
      <button class="btn btn-quiet btn-sm" type="button" data-remove="harbor" aria-label="Remove Harbor">Remove</button>
    </li>
    <li class="list-row sortable-item" data-value="pines">
      <button class="sortable-handle" type="button" aria-pressed="false" aria-label="Move Pines"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
      <div class="list-body"><img width="56" height="40" src="/demo/pines.svg" alt="Pines beside the trail" style="object-fit:cover"><strong class="list-title">Pines</strong>
        <label class="field">Alternative text for Pines<input class="input" value="Pines beside the trail"></label></div>
      <button class="btn btn-quiet btn-sm" type="button" data-remove="pines" aria-label="Remove Pines">Remove</button>
    </li>
  </ol>
  <p class="sortable-status" role="status"></p>
  <p data-removal-status role="status"></p>
</section>
