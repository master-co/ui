<section data-example="recording-search" class="grid gap-md p-lg">
  <h2 class="heading">Find a recording station</h2>
  <div class="flex flex-wrap gap-xs">
    <button type="button" class="btn btn-sm" id="replay-ime">Replay composition</button>
    <button type="button" class="btn btn-sm" id="replay-order">Replay late response</button>
  </div>
  <div class="combobox">
    <label for="station-query">Station</label>
    <div class="input-group"><input class="input-group-field" id="station-query" role="combobox" aria-expanded="false" aria-controls="station-list" aria-autocomplete="list" autocomplete="off"></div>
    <div class="listbox" popover="manual" id="station-list" role="listbox" aria-label="Matching stations"></div>
  </div>
  <p role="status" id="station-status">Type 台 to search.</p>
</section>
