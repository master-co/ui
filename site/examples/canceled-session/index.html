<section data-example="canceled-session" class="grid gap-md p-lg">
  <h2 class="heading">Friday, 22 May</h2>
  <div class="schedule" style="--schedule-hour:4.5rem; --schedule-from:9; --schedule-to:11">
    <ol class="schedule-rail" aria-hidden="true"><li>09:00</li><li>10:00</li><li>11:00</li></ol>
    <ol class="schedule-events" aria-label="22 May 2026">
      <li class="schedule-event" style="--start:9; --end:10">
        <button class="btn btn-quiet btn-sm" type="button" commandfor="session-nine" command="show-modal">Pier survey</button>
        <p class="schedule-time"><time datetime="2026-05-22T09:00">09:00</time>–<time datetime="2026-05-22T10:00">10:00</time></p></li>
      <li class="schedule-event" style="--start:10; --end:11">
        <button class="btn btn-quiet btn-sm" type="button" commandfor="session-ten" command="show-modal">Ferry crossing · Canceled</button>
        <p class="schedule-time"><time datetime="2026-05-22T10:00">10:00</time>–<time datetime="2026-05-22T11:00">11:00</time></p></li>
    </ol>
  </div>
  <dialog class="dialog" id="session-nine" aria-labelledby="nine-title"><h3 class="heading" id="nine-title">Pier survey</h3>
    <p>Meet at Pier 4 at 09:00. Bring a wind screen.</p><form method="dialog"><button class="btn" type="submit">Close details</button></form></dialog>
  <dialog class="dialog" id="session-ten" aria-labelledby="ten-title"><h3 class="heading" id="ten-title">Ferry crossing · Canceled</h3>
    <p>The 10:00–11:00 session was canceled due to high winds. The recording log keeps its original time.</p><form method="dialog"><button class="btn" type="submit">Close details</button></form></dialog>
</section>
