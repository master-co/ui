<form data-example="session-request" class="form max-w(640) mx-auto p-lg">
  <h2 class="heading">Request a recording session</h2>
  <div class="alert alert-danger" id="request-errors" tabindex="-1" aria-labelledby="error-title" hidden>
    <div class="alert-body"><h3 class="alert-title" id="error-title">Check these fields</h3><ul></ul></div>
  </div>
  <div class="field"><label for="request-name">Project name</label>
    <input class="input" id="request-name" name="project" required aria-describedby="request-name-error">
    <span class="field-error" id="request-name-error"></span></div>
  <fieldset class="fieldset"><legend class="fieldset-legend">Requested dates</legend>
    <div class="form-row">
      <div class="field"><label for="request-start">Start date</label><input class="input" id="request-start" type="date" name="start" required aria-describedby="request-start-error"><span class="field-error" id="request-start-error"></span></div>
      <div class="field"><label for="request-end">End date</label><input class="input" id="request-end" type="date" name="end" required aria-describedby="request-end-error"><span class="field-error" id="request-end-error"></span></div>
    </div>
  </fieldset>
  <fieldset class="fieldset"><legend class="fieldset-legend">Session location</legend>
    <label class="choice"><input class="radio" type="radio" name="location" value="remote" checked><span class="choice-body"><span class="choice-title">Remote</span></span></label>
    <label class="choice"><input class="radio" type="radio" name="location" value="studio"><span class="choice-body"><span class="choice-title">Studio visit</span></span></label>
  </fieldset>
  <fieldset class="fieldset" id="visit-details" hidden disabled><legend class="fieldset-legend">Visitor details</legend>
    <div class="field"><label for="request-entry">Entrance code</label><input class="input" id="request-entry" name="entry" required aria-describedby="request-entry-error"><span class="field-error" id="request-entry-error"></span></div>
  </fieldset>
  <button class="btn btn-primary" type="submit">Review request</button>
  <output role="status"></output>
</form>
