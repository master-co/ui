<section data-example="confirm-filters" class="grid gap-md p-lg" aria-labelledby="draft-results-title">
  <h2 class="heading" id="draft-results-title">Booking requests</h2>
  <button type="button" class="btn btn-sm" id="draft-trigger" aria-expanded="false">Filter by status</button>
  <p role="status"></p><ul id="draft-results"></ul>
  <div class="popover" id="draft-popover" popover="auto" aria-label="Filter by status">
    <form class="grid gap-md"><label class="field">Booking status<select class="select" name="status"><option>All</option><option>Confirmed</option><option>Pending</option></select></label>
      <div class="flex gap-xs"><button class="btn btn-primary btn-sm" type="submit">Apply filters</button><button class="btn btn-sm" type="button">Cancel</button></div></form>
  </div>
  <dialog class="dialog" id="draft-panel" aria-labelledby="draft-panel-title"><h3 class="dialog-title" id="draft-panel-title">Filter requests</h3><div class="dialog-body"></div></dialog>
</section>
