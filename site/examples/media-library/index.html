<section data-example="media-library" class="container-inline grid gap-sm p-lg max-w(720) mx-auto" aria-labelledby="library-title">
  <h2 class="heading" id="library-title">Cover artwork</h2><p id="library-collection" role="status">Collection: Lighthouse</p>
  <button type="button" class="btn" id="library-open">Choose artwork</button>
  <dialog class="dialog" aria-labelledby="library-dialog-title">
    <div class="dialog-body grid gap-sm"><h3 class="dialog-title" id="library-dialog-title">Media library</h3>
      <label class="field">Search artwork<input class="input" type="search" autocomplete="off"></label>
      <div class="auto-grid" style="--auto-grid-min:8rem"></div><p id="library-empty" hidden>No artwork matches this search.</p>
      <p role="status" id="library-count"></p>
      <div class="flex gap-xs"><button type="button" class="btn btn-primary btn-sm" id="library-add">Add selection</button><button type="button" class="btn btn-sm" id="library-cancel">Cancel</button></div>
    </div>
  </dialog>
  <template><label class="choice"><input class="checkbox" type="checkbox"><span class="choice-body"><img width="80" height="52" alt="" style="object-fit:cover"><span class="choice-title">Artwork title</span><span class="choice-description"></span></span></label></template>
</section>
