<section class="sheet container-inline flex flex-col gap-lg w-full max-w(640) p-lg" data-example="file-upload" aria-labelledby="upload-title">
  <header class="flex flex-col gap-2xs">
    <h2 class="heading heading-sm" id="upload-title">Brand assets</h2>
    <p class="m(0) fg-text-muted">Logos and guidelines for Atlas Labs. Everyone in the workspace can download them.</p>
  </header>

  <label class="dropzone">
    <input type="file" class="dropzone-input" name="assets" multiple accept="image/png,image/jpeg,application/pdf">
    <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.4989 2.6265A0.625 0.625 0 0 0 9.375 3L9.3758 12.0307A0.625 0.625 0 0 0 10.6182 12.0917L10.625 12L10.623 2.95A0.6252 0.6252 0 0 0 10.5011 2.6265Q10.2855 2.4578 10 2.4578Q9.7145 2.4578 9.4989 2.6265Z" fill="currentColor" stroke="none" fill-rule="evenodd"/><path d="M6.5 6.5L9.8586 3.1414A0.2 0.2 0 0 1 10.1414 3.1414L13.5 6.5"/><path d="M3 13.5L3 15.75A1.25 1.25 0 0 0 4.25 17L15.75 17A1.25 1.25 0 0 0 17 15.75L17 13.5"/></svg>
    <span class="dropzone-title">Drop files here or choose them</span>
    <span class="dropzone-description">PNG, JPEG or PDF, up to 10 MB each</span>
  </label>

  <div data-upload-refused hidden>
    <div class="alert alert-warning" role="status">
      <svg class="icon alert-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.8742 3.8235L13.4246 12.0144A1 1 0 0 1 12.5505 13.5L3.4495 13.5A1 1 0 0 1 2.5754 12.0144L7.1258 3.8235A1 1 0 0 1 8.8742 3.8235Z"/><path d="M8 6.5L8 9"/><circle cx="8" cy="11.5" r="0.5" fill="currentColor" stroke="none"/></svg>
      <div class="alert-body">
        <p class="alert-title" data-upload-refused-title>1 file cannot be uploaded</p>
        <p class="alert-description">Atlas takes PNG, JPEG and PDF files up to 10 MB. Remove what is marked below and choose it again in one of those formats.</p>
      </div>
    </div>
  </div>

  <div data-upload-queue hidden>
    <div class="flex flex-col gap-md">
      <ul class="flex flex-col gap-xs m(0) p(0)" aria-label="Files" data-upload-list></ul>
      <div class="flex flex-wrap items-center justify-between gap-sm">
        <p class="m(0) fg-text-muted" data-upload-summary></p>
        <button type="button" class="btn btn-primary btn-sm" data-upload-start disabled>Start upload</button>
      </div>
    </div>
  </div>

  <p class="sr-only" role="status" data-upload-status></p>

  <template data-upload-file>
    <li class="file">
      <progress class="progress file-progress" max="100" value="0" aria-label="Upload"></progress>
      <span class="file-page" aria-hidden="true"></span>
      <div class="file-body">
        <p class="file-name" tabindex="-1"></p>
        <p class="file-meta"></p>
      </div>
      <div class="file-end">
        <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Retry" data-action="retry"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.1767 6.5674A5.9666 5.9666 0 0 1 12.3585 3.6514L13.7126 5.0075A0.5 0.5 0 0 1 13.8253 5.2444A0.7044 0.7044 0 0 1 13.2444 5.8253A0.5008 0.5008 0 0 1 12.9797 5.6869L11.6364 4.3432Q10.6813 3.3314 9.3396 2.9629Q7.9979 2.5945 6.66 2.9768Q5.3222 3.359 4.3776 4.3807Q3.4331 5.4023 3.1567 6.766A0.5 0.5 0 0 1 2.1667 6.6649A0.4988 0.4988 0 0 1 2.1767 6.5674Z" fill="currentColor" stroke="none" fill-rule="evenodd"/><path d="M13.3333 2.3333L13.3333 5.1333A0.2 0.2 0 0 1 13.1333 5.3333L10.3333 5.3333"/><path d="M2.1747 10.7556A0.5008 0.5008 0 0 0 2.3131 11.0203L3.6415 12.3486A5.9659 5.9659 0 0 0 13.8276 9.4084A0.5 0.5 0 0 0 12.8631 9.1632L12.8433 9.234Q12.5669 10.5977 11.6224 11.6193Q10.6778 12.641 9.34 13.0232Q8.0021 13.4055 6.6604 13.0371Q5.3187 12.6686 4.3636 11.6568L2.9925 10.2874A0.5 0.5 0 0 0 2.7556 10.1747A0.7044 0.7044 0 0 0 2.1747 10.7556Z" fill="currentColor" stroke="none" fill-rule="evenodd"/><path d="M2.6667 13.6667L2.6667 10.8667A0.2 0.2 0 0 1 2.8667 10.6667L5.6667 10.6667"/></svg></button>
        <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Cancel upload of" data-action="cancel"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4L12 12"/><path d="M4 12L12 4"/></svg></button>
        <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Remove" data-action="remove"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4L12 12"/><path d="M4 12L12 4"/></svg></button>
      </div>
    </li>
  </template>
</section>
