<section class="sheet container-inline flex flex-col gap-lg w-full max-w(640) p-lg" data-example="file-upload" aria-labelledby="upload-title">
  <header class="flex flex-col gap-2xs">
    <h2 class="heading heading-sm" id="upload-title">Brand assets</h2>
    <p class="m(0) fg-text-muted">Logos and guidelines for Atlas Labs. Everyone in the workspace can download them.</p>
  </header>

  <label class="dropzone">
    <input type="file" class="dropzone-input" name="assets" multiple accept="image/png,image/jpeg,application/pdf">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
    <span class="dropzone-title">Drop files here or choose them</span>
    <span class="dropzone-description">PNG, JPEG or PDF, up to 10 MB each</span>
  </label>

  <div data-upload-refused hidden>
    <div class="alert alert-warning">
      <svg class="icon alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 19h18L12 4ZM12 10v4M12 17v.01"/></svg>
      <div class="alert-body">
        <p class="alert-title" data-upload-refused-title>1 file cannot be uploaded</p>
        <p class="alert-description">Atlas takes PNG, JPEG and PDF files up to 10 MB. Remove what is marked below and choose it again in one of those formats.</p>
      </div>
    </div>
  </div>

  <div data-upload-queue hidden>
    <div class="flex flex-col gap-md">
      <ul class="flex flex-col gap-xs m(0) p(0)" aria-label="Files" data-upload-list></ul>
      <div class="flex flex-wrap items-center justify-between gap-sm">
        <p class="m(0) fg-text-muted" data-upload-summary></p>
        <button type="button" class="btn btn-primary btn-sm" data-upload-start disabled>Start upload</button>
      </div>
    </div>
  </div>

  <p class="sr-only" role="status" data-upload-status></p>

  <template data-upload-file>
    <li class="file">
      <progress class="progress file-progress" max="100" value="0" aria-label="Upload"></progress>
      <span class="file-page" aria-hidden="true"></span>
      <div class="file-body">
        <p class="file-name"></p>
        <p class="file-meta"></p>
      </div>
      <div class="file-end">
        <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Retry" data-action="retry"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3L19.5 9M19.5 4v5h-5"/></svg></button>
        <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Cancel upload of" data-action="cancel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Remove" data-action="remove"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </li>
  </template>
</section>
