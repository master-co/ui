<section data-example="pending-receipt" class="grid gap-md p-lg max-w(560) mx-auto" aria-labelledby="payment-title">
  <h2 class="heading" id="payment-title">Payment inquiry</h2>
  <dl class="data-list"><div class="data-list-item"><dt class="data-list-term">Reference</dt><dd class="data-list-value" id="payment-ref">HB-00417</dd></div>
    <div class="data-list-item"><dt class="data-list-term">Amount</dt><dd class="data-list-value">$29.00 USD</dd></div></dl>
  <div class="alert" role="status"><div class="alert-body"><p class="alert-title" id="payment-state">Awaiting confirmation</p><p class="alert-description" id="payment-message">Check this reference before starting another payment.</p></div></div>
  <label class="field">Sample service response<select class="select"><option value="pending">Still processing</option><option value="confirmed">Confirmed</option><option value="expired">Expired</option></select></label>
  <button type="button" class="btn btn-sm" id="payment-action">Check status</button>
  <p id="payment-receipt" tabindex="-1" hidden></p>
</section>
