<section class="sheet container-inline flex flex-col overflow-hidden" data-example="filter-bar" aria-labelledby="fb-title">
  <header class="flex flex-wrap items-center justify-between gap-sm p-md">
    <div class="flex flex-col gap-3xs">
      <h2 class="heading heading-sm" id="fb-title">Deployments</h2>
      <p class="m(0) fg-text-muted" id="fb-summary" aria-live="polite">30 deployments in the last two weeks</p>
    </div>
  </header>

  <div class="flex flex-wrap items-center gap-xs px-md pb-md">
    <button type="button" class="btn btn-sm" popovertarget="fb-panel" data-filter="open">
      <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5365 3L11.4635 3A1 1 0 0 1 12.2548 4.6114L9.4587 8.2299A1 1 0 0 0 9.25 8.8413L9.25 11.323A1 1 0 0 1 8.6214 12.2514L7.875 12.55A0.8203 0.8203 0 0 1 6.75 11.7883L6.75 8.8413A1 1 0 0 0 6.5413 8.2299L3.7452 4.6114A1 1 0 0 1 4.5365 3Z"/></svg>
      Filters
      <span data-filter="count" aria-hidden="true" hidden><span class="badge badge-sm badge-ink badge-pill">0</span></span>
    </button>
    <div data-filter="applied" hidden>
      <div class="flex flex-wrap items-center gap-xs">
        <ul class="flex flex-wrap gap-xs m(0) p(0)" aria-label="Applied filters" data-filter="chips"></ul>
        <button type="button" class="btn btn-quiet btn-sm" data-filter="clear-all">Clear all</button>
      </div>
    </div>
  </div>

  <div class="popover p(0) w(560)" id="fb-panel" popover role="dialog" aria-labelledby="fb-panel-title" style="--popover-max-width: min(36rem, calc(100vw - 2rem))" data-filter="panel">
    <form class="flex flex-col" data-filter="form" novalidate>
      <header class="flex flex-col gap-3xs px-md pt-md pb-sm">
        <h3 class="heading heading-xs" id="fb-panel-title">Filter deployments</h3>
        <p class="m(0) fg-text-muted">A deployment shows when it meets every condition.</p>
      </header>
      <ul class="flex flex-col gap-xs m(0) px-md py-xs" data-filter="conditions"></ul>
      <p class="m(0) px-md py-xs fg-text-muted" data-filter="empty">No conditions yet: every deployment shows.</p>
      <p class="m(0) px-md py-xs fg-danger" id="fb-error" role="alert" data-filter="error" hidden></p>
      <div class="px-md pb-md">
        <button type="button" class="btn btn-quiet btn-sm" data-filter="add">
          <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8L13 8"/><path d="M8 3L8 13"/></svg>
          Add condition
        </button>
      </div>
      <footer class="flex flex-wrap items-center justify-between gap-xs p-md bt(1) bt-solid b-line-hair">
        <button type="button" class="btn btn-quiet btn-sm" data-filter="clear">Clear</button>
        <div class="flex gap-xs">
          <button type="button" class="btn btn-sm" data-filter="cancel">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Apply</button>
        </div>
      </footer>
    </form>
  </div>

  <ul class="list px-md bt(1) bt-solid b-line-hair" id="fb-results" aria-label="Matching deployments"></ul>
  <p class="m(0) px-md pb-md pt-xs fg-text-muted" id="fb-more" hidden></p>

  <template data-filter="row">
    <li class="flex flex-wrap items-center gap-xs">
      <span class="w(44) shrink(0) fg-text-muted text-end" data-part="joiner">Where</span>
      <select class="select select-sm" aria-label="Field" data-part="field"></select>
      <select class="select select-sm" aria-label="Comparison" data-part="operator"></select>
      <input class="input input-sm grow(1) basis(128) min-w(0)" aria-label="Value" data-part="value" required>
      <button type="button" class="btn btn-quiet btn-square btn-sm" aria-label="Remove condition" data-part="remove"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4L12 12"/><path d="M4 12L12 4"/></svg></button>
    </li>
  </template>
  <template data-filter="choice">
    <select class="select select-sm grow(1) basis(128)" aria-label="Value" data-part="value"></select>
  </template>
  <template data-filter="chip">
    <li><span class="chip"><span class="chip-label"></span><button type="button" class="chip-remove" aria-label="Remove the filter"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4L12 12"/><path d="M4 12L12 4"/></svg></button></span></li>
  </template>
  <template id="fb-row">
    <ul class="list"><li class="list-row">
      <div class="list-body">
        <p class="list-title"></p>
        <p class="list-description"></p>
      </div>
      <span class="list-end flex items-center gap-sm"><span class="fg-text-muted"></span><span class="badge badge-dot"></span></span>
    </li></ul>
  </template>
  <template id="fb-none">
    <ul class="list"><li class="list-row">
      <div class="list-body">
        <p class="list-title">No deployments match</p>
        <p class="list-description">Remove a filter, or clear them all to see every deployment.</p>
      </div>
    </li></ul>
  </template>
</section>
