<section class="card" data-example="chart-series" aria-labelledby="series-title">
  <header class="card-header">
    <h3 class="card-title" id="series-title">Requests by region</h3>
    <p class="card-description">Thousands of requests a month, January to October 2026</p>
    <div class="card-action">
      <div class="segmented segmented-sm" role="radiogroup" aria-label="Draw as">
        <label class="segmented-item"><input type="radio" class="segmented-input" name="series-type" value="line" checked>Lines</label>
        <label class="segmented-item"><input type="radio" class="segmented-input" name="series-type" value="bar">Bars</label>
      </div>
    </div>
  </header>
  <div class="card-body flex flex-col gap-md">
    <div class="flex flex-wrap gap-xs" role="group" aria-label="Show regions" data-legend></div>
    <div class="relative h(240) min-w(0)">
      <canvas role="img" aria-label="Requests a month by region, January to October 2026. Every region grows; the numbers are in the table below."></canvas>
    </div>
    <div class="accordion">
      <details class="accordion-item">
        <summary class="accordion-trigger">The numbers</summary>
        <div class="accordion-content">
          <div class="scroll-area scroll-area-inline">
            <table class="table table-compact">
              <caption class="sr-only">Requests a month by region, in thousands</caption>
              <thead><tr class="table-row" data-head><th class="table-heading" scope="col">Month</th></tr></thead>
              <tbody data-rows></tbody>
            </table>
          </div>
        </div>
      </details>
    </div>
  </div>
</section>
