<section data-example="pane-preference" class="grid gap-md p-md" aria-labelledby="files-title">
  <h2 class="heading" id="files-title">Recording notes</h2>
  <div class="splitter sheet" style="--splitter-size:36%">
    <div class="splitter-pane p-md"><h3 class="heading">Files</h3><p>Harbor log</p><p>Coast survey</p></div>
    <div class="splitter-handle" role="separator" aria-label="Resize the file list" aria-orientation="vertical" tabindex="0" aria-valuenow="36" aria-valuemin="20" aria-valuemax="70"></div>
    <div class="splitter-pane p-md"><h3 class="heading">Harbor log</h3><p>Microphone at the end of the pier. Record from dawn until the first ferry.</p></div>
  </div>
  <div class="flex items-center flex-wrap gap(8)">
    <button class="btn btn-sm" type="button">Restore default width</button>
    <output>File list width: 36%</output>
  </div>
</section>
