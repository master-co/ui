<section class="sheet p-lg" data-example="schedule-view" aria-label="Team calendar">
  <div class="schedule-view" id="team">
    <div class="schedule-view-header">
      <button type="button" class="btn btn-sm schedule-view-today">Today</button>
      <button type="button" class="btn btn-sm btn-square btn-quiet schedule-view-previous" aria-label="Previous"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.3586 7.8586A0.2 0.2 0 0 1 10.3586 8.1414L6 12.5" transform="rotate(180 8 8)"/></svg></button>
      <button type="button" class="btn btn-sm btn-square btn-quiet schedule-view-next" aria-label="Next"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.3586 7.8586A0.2 0.2 0 0 1 10.3586 8.1414L6 12.5"/></svg></button>
      <h2 class="schedule-view-title" aria-live="polite">November 2026</h2>
      <div class="segmented segmented-sm schedule-view-switch" role="radiogroup" aria-label="View">
        <label class="segmented-item"><input type="radio" class="segmented-input" name="team-view" value="day">Day</label>
        <label class="segmented-item"><input type="radio" class="segmented-input" name="team-view" value="week">Week</label>
        <label class="segmented-item"><input type="radio" class="segmented-input" name="team-view" value="month" checked>Month</label>
        <label class="segmented-item"><input type="radio" class="segmented-input" name="team-view" value="agenda">Agenda</label>
      </div>
    </div>
    <div class="schedule-view-body"></div>
  </div>

  <dialog class="dialog dialog-drawer" id="team-event" closedby="any" aria-labelledby="team-event-title">
    <header class="dialog-header">
      <p class="m(0)"><span class="badge badge-category badge-dot" id="team-event-calendar"></span></p>
      <h2 class="dialog-title" id="team-event-title"></h2>
      <p class="dialog-description" id="team-event-when"></p>
    </header>
    <div class="dialog-body">
      <dl class="data-list">
        <div class="data-list-item">
          <dt class="data-list-term">Where</dt>
          <dd class="data-list-value" id="team-event-where"></dd>
        </div>
        <div class="data-list-item">
          <dt class="data-list-term">Who</dt>
          <dd class="data-list-value" id="team-event-who"></dd>
        </div>
      </dl>
    </div>
    <footer class="dialog-footer">
      <button type="button" class="btn" commandfor="team-event" command="close">Close</button>
    </footer>
  </dialog>
</section>
