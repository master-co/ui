<div class="grid gap-lg w-full max-w(720) mx-auto" data-example="rich-text">
  <div class="field">
    <span id="rich-text-label">Release notes</span>
    <div class="editor">
      <div class="toolbar editor-toolbar" role="toolbar" aria-label="Formatting" aria-controls="rich-text-document">
          <select class="select select-sm" data-command="style" aria-label="Text style">
            <option value="paragraph">Paragraph</option>
            <option value="heading">Heading</option>
            <option value="subheading">Subheading</option>
          </select>
          <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="bold" aria-label="Bold" aria-keyshortcuts="Control+B Meta+B" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.6667 3H8.3333C12.3333 3 12.3333 7.6667 8.3333 7.6667H4.6667M4.6667 3V13H9C13.3333 13 13.3333 7.6667 9 7.6667"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="italic" aria-label="Italic" aria-keyshortcuts="Control+I Meta+I" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6667 3L12.6667 3"/><path d="M3.3333 13L9.3333 13"/><path d="M9.6667 3L6.3333 13" stroke-linecap="butt"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="underline" aria-label="Underline" aria-keyshortcuts="Control+U Meta+U" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.3333 2.6667V7.6667C4.3333 12.3333 11.6667 12.3333 11.6667 7.6667V2.6667"/><path d="M3 14L13 14"/></svg></button>
          <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="bulletList" aria-label="Bulleted list" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="3" cy="4" r="0.5" fill="currentColor" stroke="none"/><path d="M6 4L13.5 4"/><circle cx="3" cy="8" r="0.5" fill="currentColor" stroke="none"/><path d="M6 8L13.5 8"/><circle cx="3" cy="12" r="0.5" fill="currentColor" stroke="none"/><path d="M6 12L13.5 12"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="orderedList" aria-label="Numbered list" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.3333L3 2.6667V6M2 6H4" stroke-width="0.8"/><path d="M2 9.6667C2 8.3333 4 8.3333 4 9.6667C4 10.6667 2 11 2 12.6667H4" stroke-width="0.8"/><path d="M6.6667 4.6667L14 4.6667"/><path d="M6.6667 11.3333L14 11.3333"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="blockquote" aria-label="Quotation" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.7667 3.3333H6.2333Q6.6667 3.3333 6.6667 3.7667V8.6667C6.6667 11.3333 4.6667 12.6667 2.3333 12.6667V10.6667C4 10.6667 4.3333 9.6667 4.3333 8H2.7667Q2.3333 8 2.3333 7.5667V3.7667Q2.3333 3.3333 2.7667 3.3333Z"/><path d="M9.7667 3.3333H13.2333Q13.6667 3.3333 13.6667 3.7667V8.6667C13.6667 11.3333 11.6667 12.6667 9.3333 12.6667V10.6667C11 10.6667 11.3333 9.6667 11.3333 8H9.7667Q9.3333 8 9.3333 7.5667V3.7667Q9.3333 3.3333 9.7667 3.3333Z"/></svg></button>
          <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="link" popovertarget="rich-text-link" aria-label="Link" aria-pressed="false"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.3333L10 3.3333C11.0125 2.3208 12.6541 2.3208 13.6667 3.3333C14.6792 4.3459 14.6792 5.9875 13.6667 7L11.6667 9C10.6541 10.0125 9.0125 10.0125 8 9"/><path d="M9 4.3333L10 3.3333C11.0125 2.3208 12.6541 2.3208 13.6667 3.3333C14.6792 4.3459 14.6792 5.9875 13.6667 7L11.6667 9C10.6541 10.0125 9.0125 10.0125 8 9" transform="rotate(180 8 8)"/></svg></button>
          <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="undo" aria-label="Undo" aria-keyshortcuts="Control+Z Meta+Z"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3L3.1414 5.8586A0.2 0.2 0 0 0 3.1414 6.1414L6 9"/><path d="M2.715 6.4108A0.4996 0.4996 0 0 0 3 6.5H9.5A2.9999 2.9999 0 0 1 10.6043 12.2894Q10.0722 12.5 9.5 12.5L5.9755 12.5006A0.5 0.5 0 0 0 5.9266 13.4946L6 13.5H9.5A3.9999 3.9999 0 0 0 10.9724 5.7808Q10.263 5.5 9.5 5.5L2.9621 5.5014A0.5007 0.5007 0 0 0 2.715 5.5892A0.7044 0.7044 0 0 0 2.715 6.4108Z" fill="currentColor" stroke="none" fill-rule="evenodd"/></svg></button>
          <button type="button" class="btn btn-quiet btn-sm btn-square" data-command="redo" aria-label="Redo" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3L3.1414 5.8586A0.2 0.2 0 0 0 3.1414 6.1414L6 9" transform="translate(16 0) scale(-1 1)"/><path d="M2.715 6.4108A0.4996 0.4996 0 0 0 3 6.5H9.5A2.9999 2.9999 0 0 1 10.6043 12.2894Q10.0722 12.5 9.5 12.5L5.9755 12.5006A0.5 0.5 0 0 0 5.9266 13.4946L6 13.5H9.5A3.9999 3.9999 0 0 0 10.9724 5.7808Q10.263 5.5 9.5 5.5L2.9621 5.5014A0.5007 0.5007 0 0 0 2.715 5.5892A0.7044 0.7044 0 0 0 2.715 6.4108Z" fill="currentColor" stroke="none" fill-rule="evenodd" transform="translate(16 0) scale(-1 1)"/></svg></button>
      </div>
      <div class="flex flex-col" data-editor></div>
    </div>
    <p class="field-hint" id="rich-text-hint">Headings, lists, quotations and links. Pasted text keeps its structure, not its styling.</p>
    <p class="field-error" id="rich-text-error">Write at least a sentence before you publish.</p>
  </div>

  <form class="popover grid gap-sm w(288)" id="rich-text-link" popover aria-label="Link">
    <label class="field">
      Address
      <input class="input input-sm" type="url" name="href" required placeholder="https://example.com" autocomplete="url">
    </label>
    <div class="flex justify-end gap-xs">
      <button type="button" class="btn btn-sm btn-quiet" data-command="unlink">Remove link</button>
      <button type="submit" class="btn btn-sm btn-primary">Apply</button>
    </div>
  </form>

  <div class="flex flex-wrap items-center gap-sm">
    <label class="check"><input type="checkbox" role="switch" class="switch" data-state="readonly"> Read only</label>
    <label class="check"><input type="checkbox" role="switch" class="switch" data-state="disabled"> Disabled</label>
    <span class="grow(1)"></span>
    <button type="button" class="btn btn-sm" data-command="replace">Load other notes</button>
    <button type="button" class="btn btn-sm" data-command="reset">Reset</button>
  </div>

  <div class="accordion">
    <details class="accordion-item">
      <summary class="accordion-trigger">The value, as JSON</summary>
      <div class="accordion-content">
        <pre class="code-block max-h(240)" tabindex="0" role="region" aria-label="The value, as JSON"><code data-value></code></pre>
      </div>
    </details>
  </div>
</div>
