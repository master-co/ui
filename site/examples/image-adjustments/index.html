<section class="sheet p-lg container-inline" data-example="image-adjustments" aria-labelledby="adjust-title">
  <div class="flex flex-wrap items-center justify-between gap-sm mb-md">
    <h2 class="m(0) text-md font-medium fg-text-strong" id="adjust-title">Adjust a picture</h2>
    <div class="flex flex-wrap items-center gap-xs">
      <label class="btn btn-sm">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v12"/></svg>
        <span data-choose>Choose a picture</span>
        <input type="file" class="sr-only" accept="image/*" aria-describedby="adjust-hint">
      </label>
      <button type="button" class="btn btn-sm btn-quiet" data-clear disabled>Clear</button>
    </div>
  </div>
  <p class="m(0) mb-md text-sm fg-text-muted" id="adjust-hint">The picture stays in this browser. Nothing is uploaded.</p>
  <div data-error hidden>
    <div class="alert alert-danger mb-md" role="alert">
      <div class="alert-body"><p class="alert-description">That file could not be read as a picture. Choose a PNG, JPG, WebP or AVIF.</p></div>
    </div>
  </div>

  <div class="grid gap-lg grid-cols(1) grid-cols(2)@container(--2xl)">
    <div class="flex flex-col gap-sm min-w(0)">
      <div class="cropper" style="--cropper-x: 0; --cropper-y: 0; --cropper-width: 1; --cropper-height: 1">
        <img class="cropper-image" src="/demo/dawn.svg" alt="A pier at dawn" width="640" height="400">
        <div class="cropper-box" role="application" aria-roledescription="crop box" tabindex="0" aria-label="Crop the picture">
          <span class="cropper-handle cropper-handle-top cropper-handle-left"></span>
          <span class="cropper-handle cropper-handle-top"></span>
          <span class="cropper-handle cropper-handle-top cropper-handle-right"></span>
          <span class="cropper-handle cropper-handle-right"></span>
          <span class="cropper-handle cropper-handle-bottom cropper-handle-right"></span>
          <span class="cropper-handle cropper-handle-bottom"></span>
          <span class="cropper-handle cropper-handle-bottom cropper-handle-left"></span>
          <span class="cropper-handle cropper-handle-left"></span>
        </div>
        <p class="cropper-status" role="status"></p>
      </div>
      <div class="flex flex-wrap items-center gap-xs">
        <button type="button" class="btn btn-sm" data-rotate="-90"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 5 8l4 4"/><path d="M5 8h9a5 5 0 0 1 0 10h-3"/></svg>Rotate left</button>
        <button type="button" class="btn btn-sm" data-rotate="90"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 4 4-4 4"/><path d="M19 8h-9a5 5 0 0 0 0 10h3"/></svg>Rotate right</button>
      </div>
    </div>

    <div class="flex flex-col gap-md min-w(0)">
      <div class="well overflow-hidden flex items-center justify-center h(220)" data-stage aria-label="The adjusted picture" role="img"></div>
      <div class="segmented segmented-sm" role="radiogroup" aria-label="Show the picture">
        <label class="segmented-item"><input type="radio" class="segmented-input" name="adjust-mode" value="fit" checked>Fit</label>
        <label class="segmented-item"><input type="radio" class="segmented-input" name="adjust-mode" value="fill">Fill</label>
        <label class="segmented-item"><input type="radio" class="segmented-input" name="adjust-mode" value="tile">Tile</label>
      </div>
      <div class="grid gap-sm">
        <div class="field">
          <div class="flex items-baseline justify-between"><label for="adjust-brightness">Brightness</label><output class="fg-text-muted" for="adjust-brightness" data-for="brightness">100%</output></div>
          <input type="range" class="slider" id="adjust-brightness" name="brightness" min="0" max="200" value="100">
        </div>
        <div class="field">
          <div class="flex items-baseline justify-between"><label for="adjust-contrast">Contrast</label><output class="fg-text-muted" for="adjust-contrast" data-for="contrast">100%</output></div>
          <input type="range" class="slider" id="adjust-contrast" name="contrast" min="0" max="200" value="100">
        </div>
        <div class="field">
          <div class="flex items-baseline justify-between"><label for="adjust-saturation">Saturation</label><output class="fg-text-muted" for="adjust-saturation" data-for="saturation">100%</output></div>
          <input type="range" class="slider" id="adjust-saturation" name="saturation" min="0" max="200" value="100">
        </div>
      </div>
      <div class="flex flex-wrap gap-xs">
        <button type="button" class="btn btn-sm" data-reset>Reset</button>
      </div>
    </div>
  </div>

  <details class="mt-lg">
    <summary class="text-sm fg-text-strong">What the page hands on</summary>
    <pre class="code-block mt-sm"><code data-output></code></pre>
  </details>
</section>
