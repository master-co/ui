<section data-example="member-invitations" class="container-inline grid gap-md p-lg max-w(700) mx-auto" aria-labelledby="invites-title">
  <h2 class="heading" id="invites-title">Invite a studio member</h2>
  <form class="form"><div class="form-row"><label class="field">Email address<input class="input" type="email" name="email" required autocomplete="email"></label>
    <label class="field">Role<select class="select" name="role"><option>Viewer</option><option>Editor</option></select></label></div>
    <button class="btn btn-primary btn-sm" type="submit">Invite member</button></form>
  <h3 class="heading" id="invites-pending">Awaiting a reply</h3><ul class="list" aria-labelledby="invites-pending"></ul>
  <p role="status"></p>
</section>
