<section class="card" data-example="chart-radar" aria-labelledby="radar-title">
  <header class="card-header">
    <h3 class="card-title" id="radar-title">Release scores</h3>
    <p class="card-description">Six measures, each from 0 to 100</p>
  </header>
  <div class="card-body flex flex-col gap-md">
    <div class="flex flex-wrap gap-xs" role="group" aria-label="Show releases" data-legend></div>
    <div class="relative h(280) min-w(0)">
      <canvas role="img" aria-label="Release scores: v0.4 scores higher than v0.3 on all six measures; the numbers are in the table below."></canvas>
    </div>
    <div class="accordion">
      <details class="accordion-item">
        <summary class="accordion-trigger">The numbers</summary>
        <div class="accordion-content">
          <table class="table table-compact">
            <caption class="sr-only">Release scores, from 0 to 100</caption>
            <thead><tr class="table-row" data-head><th class="table-heading" scope="col">Measure</th></tr></thead>
            <tbody data-rows></tbody>
          </table>
        </div>
      </details>
    </div>
  </div>
</section>
