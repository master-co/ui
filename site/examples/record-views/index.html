<section data-example="record-views" class="grid gap-md p-lg" aria-labelledby="bookings-title">
  <h2 class="heading" id="bookings-title">Studio bookings</h2>
  <div class="container-inline relative">
  <div class="hidden block@container(--2xl)"><table class="table table-compact" aria-label="Studio bookings">
    <thead><tr><th class="table-heading" scope="col">Select</th><th class="table-heading" scope="col">Booking</th><th class="table-heading table-numeric" scope="col">Fee (USD)</th><th class="table-heading" scope="col">Status</th><th class="table-heading" scope="col">Actions</th></tr></thead><tbody></tbody>
  </table></div>
  <ul class="list invisible@container(--2xl) absolute@container(--2xl) inset(0)@container(--2xl) overflow-clip@container(--2xl)" aria-label="Studio bookings"></ul>
  </div>
  <p role="status">0 selected</p>
  <dialog class="dialog" id="booking-details" aria-labelledby="booking-detail-title"><div class="dialog-body"><h3 class="heading" id="booking-detail-title"></h3><p></p></div>
    <form method="dialog"><button class="btn btn-sm" type="submit">Close details</button></form></dialog>
</section>
