<section data-example="settings-save" class="container-inline p-lg max-w(640) mx-auto" aria-labelledby="save-title">
  <form class="form"><h2 class="heading" id="save-title">Archive settings</h2>
    <div class="field"><label for="archive-name">Archive name</label><input class="input" id="archive-name" name="archive" value="Harbor Studio" required></div>
    <label class="field">Sample service response<select class="select" name="response"><option value="ok">Success</option><option value="fail">Fail this save</option></select></label>
    <div class="form-actions flex-wrap"><span role="status" class="mr-auto">All changes saved</span>
      <button type="button" class="btn btn-sm" disabled>Discard</button><button type="submit" class="btn btn-primary btn-sm" disabled>Save settings</button></div>
  </form>
</section>
